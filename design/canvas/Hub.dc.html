<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{W}}px; height: {{H}}px; overflow: hidden; background: radial-gradient(120% 80% at 50% 15%, #33278a, #1a1246); font-family: 'Baloo 2', system-ui, sans-serif; color: #ffffff;">
<div style="zoom: {{Z}}; width: {{IW}}px; height: {{IH}}px; box-sizing: border-box; padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 14px;">

<div style="display: flex; align-items: center; gap: 12px;">
<a href="{{whoHref}}" aria-label="Switch player" style="width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; text-decoration: none; color: #ffffff; font-size: 28px; font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,0.25); {{avatar}}">M</a>
<div style="display: flex; flex-direction: column; line-height: 1.1; flex-grow: 1;">
<span style="font-size: 24px; font-weight: 800;">Hi Maya!</span>
<span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; font-weight: 800; color: #c9c2ff;">
<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z" fill="#ffb21f"></path></svg>
42 stars · 12/40 stickers
</span>
</div>
<a href="{{grownHref}}" aria-label="Settings for grown-ups" style="width: 54px; height: 54px; flex-shrink: 0; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
</a>
</div>

<a href="{{mixerHref}}" style="text-decoration: none; color: #5a3500; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: linear-gradient(180deg, #ffe266, #ffc21a); box-shadow: 0 5px 0 #d48a00;">
<span style="position: relative; width: 56px; height: 44px; flex-shrink: 0;" aria-hidden="true">
<span style="position: absolute; left: 0; top: 4px; width: 34px; height: 34px; border-radius: 50%; background: #f03a3a; opacity: 0.9;"></span>
<span style="position: absolute; left: 20px; top: 4px; width: 34px; height: 34px; border-radius: 50%; background: #2f8cff; opacity: 0.85; mix-blend-mode: multiply;"></span>
</span>
<span style="display: flex; flex-direction: column; line-height: 1.15; flex-grow: 1;">
<span style="font-size: 14px; font-weight: 800; letter-spacing: 0.5px;">TODAY'S DISCOVERY</span>
<span style="font-size: 19px; font-weight: 800;">What do red and blue make?</span>
</span>
<span style="font-size: 14px; font-weight: 800; white-space: nowrap;">+1 sticker</span>
</a>

<div style="display: flex; align-items: baseline; gap: 8px;">
<h2 style="margin: 0; font-size: 20px; font-weight: 800;">Brain games</h2>
<span style="font-size: 14px; font-weight: 700; color: #8e85d6;">think and plan</span>
</div>
<div style="display: grid; grid-template-columns: {{gameCols}}; gap: 10px;">
<sc-for list="{{games}}" as="g" hint-placeholder-count="3">
<a href="{{g.href}}" style="text-decoration: none; color: #ffffff; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<span style="position: relative; width: 66px; height: 50px; flex-shrink: 0;" aria-hidden="true">
<sc-for list="{{g.art}}" as="a" hint-placeholder-count="3">
<span style="position: absolute; display: grid; place-items: center; font-weight: 800; color: #ffffff; {{a.style}}">{{a.t}}</span>
</sc-for>
</span>
<span style="display: flex; flex-direction: column; line-height: 1.15; flex-grow: 1; min-width: 0;">
<span style="font-size: 20px; font-weight: 800;">{{g.title}}</span>
<span style="font-size: 14px; font-weight: 600; color: #c9c2ff;">{{g.sub}}</span>
</span>
<span style="font-size: 14px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: #30257a; white-space: nowrap;">{{g.level}}</span>
</a>
</sc-for>
</div>

<div style="display: flex; align-items: baseline; gap: 8px;">
<h2 style="margin: 0; font-size: 20px; font-weight: 800;">Explore</h2>
<span style="font-size: 14px; font-weight: 700; color: #8e85d6;">colors, shapes and numbers</span>
</div>
<div style="display: grid; grid-template-columns: {{exploreCols}}; gap: 10px;">
<sc-for list="{{explore}}" as="x" hint-placeholder-count="5">
<a href="{{x.href}}" style="text-decoration: none; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; padding: 10px 6px; height: 104px; box-sizing: border-box; border-radius: 20px; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<span style="position: relative; width: 60px; height: 46px;" aria-hidden="true">
<sc-for list="{{x.art}}" as="a" hint-placeholder-count="3">
<span style="position: absolute; display: grid; place-items: center; font-weight: 800; color: #ffffff; {{a.style}}">{{a.t}}</span>
</sc-for>
</span>
<span style="font-size: 15px; font-weight: 800; line-height: 1.1; text-align: center;">{{x.title}}</span>
</a>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pal() {
    return {
      red: ['#f03a3a', '#ff7a6e', '#b51f27'], yellow: ['#ffc21a', '#ffe266', '#d48a00'],
      green: ['#1fb53c', '#5fe06e', '#0f7a26'], blue: ['#2f8cff', '#7cc0ff', '#1557c4'],
      purple: ['#9b4dff', '#c79bff', '#6624c9'], orange: ['#ff7a1a', '#ffab5e', '#c4500a'],
      pink: ['#ff5fb4', '#ff9fd4', '#c72f84'], teal: ['#14c8c0', '#6aeee4', '#0b8c87']
    };
  }
  brick(color, stud) {
    var p = this.pal()[color];
    var studs = 'radial-gradient(circle at 46% 42%, ' + p[1] + ' 0 19%, transparent 21%), radial-gradient(circle at 50% 50%, ' + p[0] + ' 0 25%, transparent 27%), radial-gradient(circle at 54% 58%, rgba(0,0,0,0.28) 0 26%, transparent 28%), ';
    var base = 'linear-gradient(160deg, ' + p[1] + ' -30%, ' + p[0] + ' 45%, ' + p[2] + ' 140%)';
    var size = stud ? stud + 'px ' + stud + 'px, ' + stud + 'px ' + stud + 'px, ' + stud + 'px ' + stud + 'px, 100% 100%' : '100% 100%';
    return 'background: ' + (stud ? studs : '') + base + '; background-size: ' + size + '; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -3px 0 rgba(0,0,0,0.22);';
  }
  at(x, y, w, h, extra) {
    return 'left: ' + x + 'px; top: ' + y + 'px; width: ' + w + 'px; height: ' + h + 'px; ' + extra;
  }
  renderVals() {
    var self = this;
    var tablet = this.props.device === 'tablet';
    var t = tablet ? 'Tablet' : '';
    var b = function (c, s) { return 'border-radius: 5px; ' + self.brick(c, s); };
    return {
      W: tablet ? 834 : 390, H: tablet ? 1194 : 844, Z: tablet ? 1.4 : 1, IW: tablet ? 596 : 390, IH: tablet ? 853 : 844,
      gameCols: 'repeat(1, minmax(0, 1fr))',
      exploreCols: tablet ? 'repeat(6, minmax(0, 1fr))' : 'repeat(3, minmax(0, 1fr))',
      whoHref: tablet ? 'MainTablet.dc.html' : 'Main.dc.html',
      mixerHref: 'Mixer' + t + '.dc.html',
      grownHref: 'Grownups' + t + '.dc.html',
      avatar: this.brick('blue', 0),
      games: [
        {
          title: 'Brick Escape', sub: 'Slide bricks out their doors', level: 'Level 9', href: 'Escape' + t + '.dc.html',
          art: [
            { t: '', style: this.at(0, 0, 40, 20, b('red', 10)) },
            { t: '', style: this.at(42, 0, 20, 40, b('yellow', 10)) },
            { t: '', style: this.at(0, 22, 20, 20, b('green', 10)) },
            { t: '', style: this.at(22, 22, 18, 20, b('blue', 10)) }
          ]
        },
        {
          title: 'Brick Drop', sub: 'Stack falling bricks into rows', level: 'Stage 4', href: 'Drop' + t + '.dc.html',
          art: [
            { t: '', style: this.at(10, 26, 54, 18, b('purple', 9)) },
            { t: '', style: this.at(28, 6, 18, 18, b('purple', 9)) },
            { t: '', style: this.at(0, 6, 18, 18, b('teal', 9)) }
          ]
        },
        {
          title: 'Letter Builder', sub: 'Alphabet, sounds and spelling', level: 'Level 17', href: 'Letters' + t + '.dc.html',
          art: [
            { t: 'A', style: this.at(0, 10, 20, 26, b('orange', 0) + ' font-size: 15px;') },
            { t: 'B', style: this.at(22, 10, 20, 26, b('pink', 0) + ' font-size: 15px;') },
            { t: 'C', style: this.at(44, 10, 20, 26, b('blue', 0) + ' font-size: 15px;') }
          ]
        }
      ],
      explore: [
        {
          title: 'Color Mixer', href: 'Mixer' + t + '.dc.html',
          art: [
            { t: '', style: this.at(6, 6, 30, 30, 'border-radius: 50%; background: #ffc21a;') },
            { t: '', style: this.at(24, 6, 30, 30, 'border-radius: 50%; background: #2f8cff; mix-blend-mode: multiply;') }
          ]
        },
        {
          title: 'Shape Sorter', href: 'Sorter' + t + '.dc.html',
          art: [
            { t: '', style: this.at(0, 14, 22, 22, 'border-radius: 50%; background: #ff5fb4;') },
            { t: '', style: this.at(20, 4, 24, 22, 'clip-path: polygon(50% 0, 100% 100%, 0 100%); background: #ffc21a;') },
            { t: '', style: this.at(38, 20, 20, 20, 'border-radius: 4px; background: #14c8c0;') }
          ]
        },
        {
          title: 'Pattern Train', href: 'Pattern' + t + '.dc.html',
          art: [
            { t: '', style: this.at(0, 14, 16, 16, 'border-radius: 50%; background: #f03a3a;') },
            { t: '', style: this.at(20, 14, 16, 16, 'border-radius: 3px; background: #2f8cff;') },
            { t: '', style: this.at(40, 14, 16, 16, 'border-radius: 50%; background: #f03a3a;') }
          ]
        },
        {
          title: 'Number Line-up', href: 'Numbers' + t + '.dc.html',
          art: [
            { t: '1', style: this.at(0, 14, 18, 24, b('green', 0) + ' font-size: 15px;') },
            { t: '2', style: this.at(20, 8, 18, 30, b('yellow', 0) + ' font-size: 15px;') },
            { t: '3', style: this.at(40, 2, 18, 36, b('red', 0) + ' font-size: 15px;') }
          ]
        },
        {
          title: 'Picture Builder', href: 'Builder' + t + '.dc.html',
          art: [
            { t: '', style: this.at(14, 0, 14, 14, b('red', 7)) },
            { t: '', style: this.at(30, 0, 14, 14, b('red', 7)) },
            { t: '', style: this.at(6, 16, 14, 14, b('yellow', 7)) },
            { t: '', style: this.at(22, 16, 14, 14, b('blue', 7)) },
            { t: '', style: this.at(38, 16, 14, 14, b('yellow', 7)) },
            { t: '', style: this.at(6, 32, 46, 14, 'border-radius: 4px; background: #ffc21a;') }
          ]
        },
        {
          title: 'Brick Calculator', href: 'Math' + t + '.dc.html',
          art: [
            { t: '2', style: this.at(0, 10, 18, 26, b('blue', 0) + ' font-size: 15px;') },
            { t: '+', style: this.at(19, 10, 20, 26, 'font-size: 20px; color: #c9c2ff;') },
            { t: '3', style: this.at(40, 10, 18, 26, b('orange', 0) + ' font-size: 15px;') }
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
