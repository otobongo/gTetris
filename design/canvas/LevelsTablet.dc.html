<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level picker, tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<dc-import name="Levels" device="tablet" state="{{state}}" hint-size="834px,1194px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","picked","confirmReset","resetDone"],"default":"default"},"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() { return { state: this.props.state ?? 'default' }; }
}
</script>
</body>
</html>
