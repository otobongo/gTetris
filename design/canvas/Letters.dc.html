<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letter Builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button:focus-visible, a:focus-visible { outline: 3px solid #ffc21a; outline-offset: 2px; } @keyframes bw-fade { from { opacity: 0; } } @keyframes bw-card-in { from { opacity: 0; transform: scale(0.96); } } .bw-appear { animation: bw-fade 150ms linear; } .bw-card { animation: bw-card-in 200ms cubic-bezier(0.16,1,0.3,1); } .bw-dot { transition: width 200ms cubic-bezier(0.16,1,0.3,1); } .bw-dot-fill { transition: transform 350ms cubic-bezier(0.16,1,0.3,1); } @media (prefers-reduced-motion: reduce) { .bw-card { animation: bw-fade 150ms linear; } .bw-dot { transition: none; } .bw-dot-fill { transition: opacity 150ms linear; } }</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; overflow: hidden; background: radial-gradient(120% 80% at 50% 15%, #33278a, #1a1246); font-family: 'Baloo 2', system-ui, sans-serif; color: #ffffff;">
<div style="zoom: {{z}}; width: {{iw}}px; height: {{ih}}px; box-sizing: border-box; padding: 20px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative;">

<div style="width: 100%; display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 10px;">
<a href="{{hubHref}}" aria-label="Back to home" style="width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="text-align: center; line-height: 1.1; min-width: 0;">
<div style="font-size: 24px; font-weight: 800;">{{title}}</div>
<sc-if value="{{showDots}}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="{{dotsLabel}}" style="display: flex; justify-content: center; gap: 6px; margin-top: 4px;">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<span class="bw-dot" style="display: block; width: {{d.w}}px; height: 10px; border-radius: 999px; overflow: hidden; background: {{d.bg}}; box-shadow: {{d.ring}};"><span class="bw-dot-fill" style="display: block; width: 100%; height: 100%; background: #ffc21a; transform-origin: left center; transform: scaleX({{d.fill}}); opacity: {{d.fill}};"></span></span>
</sc-for>
</div>
</sc-if>
</div>
<div style="display: grid;">
<sc-if value="{{showPlayArea}}" hint-placeholder-val="{{ true }}">
<button onClick="{{speak}}" aria-label="{{speakLabel}}" style="border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9.5a3.5 3.5 0 0 1 0 5"></path><path d="M19 7a7 7 0 0 1 0 10"></path></svg>
</button>
</sc-if>
</div>
</div>

<sc-if value="{{showPlayArea}}" hint-placeholder-val="{{ true }}">
<div style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 14px; box-sizing: border-box; border-radius: 18px; background: #30257a;">
<span style="width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: {{kidcolor}}; color: #ffffff; font-size: 18px; font-weight: 800;">{{kidInitial}}</span>
<span style="flex-grow: 1; font-size: 16px; font-weight: 800; line-height: 1.1;">{{kidLine}}</span>
</div>
</sc-if>

<sc-if value="{{showPlayArea}}" hint-placeholder-val="{{ true }}">
<button onClick="{{sayWord}}" aria-label="Picture of a {{word}}, tap to hear it" style="border: 0; cursor: pointer; margin-top: 10px; width: 230px; height: 190px; border-radius: 36px; display: grid; place-items: center; background: linear-gradient(180deg, #4a3ca8, #30257a); box-shadow: inset 0 0 0 4px #5444b8, 0 8px 0 #241a63;">
<sc-if value="{{isSun}}" hint-placeholder-val="{{ true }}">
<svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
<g stroke="#ffc21a" stroke-width="7" stroke-linecap="round"><path d="M50 6v12M50 82v12M6 50h12M82 50h12M19 19l8 8M73 73l8 8M81 19l-8 8M27 73l-8 8"></path></g>
<circle cx="50" cy="50" r="24" fill="#ffc21a"></circle><circle cx="50" cy="50" r="24" fill="none" stroke="#d48a00" stroke-width="3"></circle>
<circle cx="42" cy="46" r="3.5" fill="#5a3500"></circle><circle cx="58" cy="46" r="3.5" fill="#5a3500"></circle>
<path d="M41 57c5 5 13 5 18 0" fill="none" stroke="#5a3500" stroke-width="3.5" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{isBus}}" hint-placeholder-val="{{ false }}">
<svg width="170" height="130" viewBox="0 0 120 90" aria-hidden="true">
<rect x="8" y="12" width="104" height="56" rx="12" fill="#ffc21a" stroke="#d48a00" stroke-width="3"></rect>
<rect x="18" y="22" width="20" height="18" rx="4" fill="#7cc0ff"></rect><rect x="44" y="22" width="20" height="18" rx="4" fill="#7cc0ff"></rect><rect x="70" y="22" width="20" height="18" rx="4" fill="#7cc0ff"></rect>
<rect x="95" y="22" width="10" height="36" rx="3" fill="#7cc0ff"></rect>
<rect x="8" y="48" width="104" height="6" fill="#d48a00"></rect>
<circle cx="32" cy="70" r="11" fill="#2e2e38"></circle><circle cx="32" cy="70" r="4" fill="#b9b3c9"></circle>
<circle cx="88" cy="70" r="11" fill="#2e2e38"></circle><circle cx="88" cy="70" r="4" fill="#b9b3c9"></circle>
</svg>
</sc-if>
<sc-if value="{{isBox}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="140" viewBox="0 0 100 94" aria-hidden="true">
<path d="M10 30l40-18 40 18-40 18z" fill="#e0a45e"></path>
<path d="M10 30v40l40 18V48z" fill="#c4802f"></path>
<path d="M90 30v40L50 88V48z" fill="#a8681f"></path>
<path d="M30 21l40 18v14" fill="none" stroke="#f1eef7" stroke-width="6"></path>
</svg>
</sc-if>
<sc-if value="{{isCat}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="140" viewBox="0 0 100 94" aria-hidden="true">
<path d="M22 42L17 10l23 15z" fill="#ffab5e" stroke="#c4500a" stroke-width="3" stroke-linejoin="round"></path>
<path d="M78 42l5-32-23 15z" fill="#ffab5e" stroke="#c4500a" stroke-width="3" stroke-linejoin="round"></path>
<path d="M23 20l2 12 8-5z" fill="#ff9fd4"></path><path d="M77 20l-2 12-8-5z" fill="#ff9fd4"></path>
<ellipse cx="50" cy="54" rx="34" ry="30" fill="#ffab5e" stroke="#c4500a" stroke-width="3"></ellipse>
<path d="M43 26v8M50 25v10M57 26v8" fill="none" stroke="#ff7a1a" stroke-width="3.5" stroke-linecap="round"></path>
<circle cx="37" cy="51" r="5" fill="#2e2e38"></circle><circle cx="63" cy="51" r="5" fill="#2e2e38"></circle>
<circle cx="38.5" cy="49.5" r="1.6" fill="#ffffff"></circle><circle cx="64.5" cy="49.5" r="1.6" fill="#ffffff"></circle>
<path d="M45 61h10l-5 5z" fill="#c72f84"></path>
<path d="M50 66c-2 4-7 5-10 2M50 66c2 4 7 5 10 2" fill="none" stroke="#c4500a" stroke-width="2.5" stroke-linecap="round"></path>
<path d="M30 63H13M30 68l-15 4M70 63h17M70 68l15 4" fill="none" stroke="#c4500a" stroke-width="2.2" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{isFish}}" hint-placeholder-val="{{ false }}">
<svg width="170" height="130" viewBox="0 0 120 90" aria-hidden="true">
<path d="M42 24c6-12 22-14 30-2" fill="#ffab5e" stroke="#c4500a" stroke-width="3" stroke-linejoin="round"></path>
<path d="M86 45l26-21v42z" fill="#ff7a1a" stroke="#c4500a" stroke-width="3" stroke-linejoin="round"></path>
<ellipse cx="52" cy="45" rx="40" ry="26" fill="#ff7a1a" stroke="#c4500a" stroke-width="3"></ellipse>
<path d="M46 27c-5 12-5 24 0 36" fill="none" stroke="#c4500a" stroke-width="3" stroke-linecap="round"></path>
<circle cx="30" cy="40" r="5.5" fill="#ffffff"></circle><circle cx="29" cy="40" r="3" fill="#2e2e38"></circle>
<path d="M15 50c3 2.5 6 2.5 9 0" fill="none" stroke="#c4500a" stroke-width="3" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{isFrog}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="140" viewBox="0 0 100 94" aria-hidden="true">
<circle cx="31" cy="30" r="14" fill="#1fb53c" stroke="#0f7a26" stroke-width="3"></circle>
<circle cx="69" cy="30" r="14" fill="#1fb53c" stroke="#0f7a26" stroke-width="3"></circle>
<ellipse cx="50" cy="60" rx="40" ry="28" fill="#1fb53c" stroke="#0f7a26" stroke-width="3"></ellipse>
<ellipse cx="50" cy="72" rx="22" ry="11" fill="#5fe06e"></ellipse>
<circle cx="31" cy="29" r="8" fill="#ffffff"></circle><circle cx="69" cy="29" r="8" fill="#ffffff"></circle>
<circle cx="32" cy="30" r="4" fill="#2e2e38"></circle><circle cx="68" cy="30" r="4" fill="#2e2e38"></circle>
<path d="M32 52c10 9 26 9 36 0" fill="none" stroke="#0f7a26" stroke-width="3.5" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{isHouse}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="140" viewBox="0 0 100 94" aria-hidden="true">
<rect x="66" y="18" width="10" height="20" fill="#b51f27"></rect>
<rect x="20" y="44" width="60" height="42" rx="3" fill="#ffe266" stroke="#d48a00" stroke-width="3"></rect>
<path d="M10 47L50 13l40 34z" fill="#f03a3a" stroke="#b51f27" stroke-width="3" stroke-linejoin="round"></path>
<rect x="27" y="56" width="13" height="13" rx="2" fill="#7cc0ff"></rect><rect x="60" y="56" width="13" height="13" rx="2" fill="#7cc0ff"></rect>
<rect x="43" y="62" width="14" height="24" rx="3" fill="#c4802f"></rect>
</svg>
</sc-if>
<sc-if value="{{isDuck}}" hint-placeholder-val="{{ false }}">
<svg width="170" height="130" viewBox="0 0 120 90" aria-hidden="true">
<path d="M98 52l14-14-1 22z" fill="#ffc21a" stroke="#d48a00" stroke-width="3" stroke-linejoin="round"></path>
<ellipse cx="62" cy="58" rx="40" ry="22" fill="#ffc21a" stroke="#d48a00" stroke-width="3"></ellipse>
<path d="M52 54c8 11 26 11 32 0-10 4-22 4-32 0z" fill="#ffe266" stroke="#d48a00" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="34" cy="30" r="17" fill="#ffc21a" stroke="#d48a00" stroke-width="3"></circle>
<path d="M19 29c-8 0-13 3-13 5.5s5 4.5 14 3z" fill="#ff7a1a" stroke="#c4500a" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="32" cy="25" r="3.5" fill="#2e2e38"></circle><circle cx="33" cy="24" r="1.2" fill="#ffffff"></circle>
<path d="M10 84q10-6 20 0t20 0 20 0 20 0 20 0" fill="none" stroke="#7cc0ff" stroke-width="4" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{isRocket}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
<path d="M42 78q8 20 16 0z" fill="#ffc21a"></path><path d="M46 78q4 11 8 0z" fill="#ff7a1a"></path>
<path d="M36 54L20 80l16-5z" fill="#f03a3a" stroke="#b51f27" stroke-width="3" stroke-linejoin="round"></path>
<path d="M64 54l16 26-16-5z" fill="#f03a3a" stroke="#b51f27" stroke-width="3" stroke-linejoin="round"></path>
<path d="M50 8c14 12 18 34 16 70H34C32 42 36 20 50 8z" fill="#f1eef7"></path>
<path d="M50 8c6 5 10 11 12 19H38c2-8 6-14 12-19z" fill="#f03a3a"></path>
<path d="M50 8c14 12 18 34 16 70H34C32 42 36 20 50 8z" fill="none" stroke="#b9b3c9" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="50" cy="46" r="9" fill="#7cc0ff" stroke="#2f8cff" stroke-width="3"></circle>
</svg>
</sc-if>
<sc-if value="{{isRainbow}}" hint-placeholder-val="{{ false }}">
<svg width="170" height="130" viewBox="0 0 120 90" aria-hidden="true">
<g fill="none" stroke-width="8">
<path d="M14 70a46 46 0 0 1 92 0" stroke="#f03a3a"></path>
<path d="M22 70a38 38 0 0 1 76 0" stroke="#ffc21a"></path>
<path d="M30 70a30 30 0 0 1 60 0" stroke="#1fb53c"></path>
<path d="M38 70a22 22 0 0 1 44 0" stroke="#2f8cff"></path>
<path d="M46 70a14 14 0 0 1 28 0" stroke="#9b4dff"></path>
</g>
<g fill="#f1eef7">
<circle cx="10" cy="74" r="9"></circle><circle cx="21" cy="68" r="11"></circle><circle cx="31" cy="76" r="8"></circle><rect x="6" y="74" width="28" height="10" rx="5"></rect>
<circle cx="110" cy="74" r="9"></circle><circle cx="99" cy="68" r="11"></circle><circle cx="89" cy="76" r="8"></circle><rect x="86" y="74" width="28" height="10" rx="5"></rect>
</g>
</svg>
</sc-if>
<sc-if value="{{isUmbrella}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
<path d="M50 46v38a8 8 0 0 1-16 0" fill="none" stroke="#ffc21a" stroke-width="6" stroke-linecap="round"></path>
<path d="M8 50A42 40 0 0 1 92 50q-7-8-14 0q-7-8-14 0q-7-8-14 0q-7-8-14 0q-7-8-14 0q-7-8-14 0z" fill="#f03a3a" stroke="#b51f27" stroke-width="3" stroke-linejoin="round"></path>
<path d="M50 10q-14 16-14 40M50 10q14 16 14 40M50 10v40" fill="none" stroke="#b51f27" stroke-width="3" stroke-linecap="round"></path>
<circle cx="50" cy="8" r="3.5" fill="#b51f27"></circle>
</svg>
</sc-if>
<sc-if value="{{isPenguin}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
<path d="M33 88h13l-1 6H31zM54 88h13l2 6H55z" fill="#ff7a1a" stroke="#c4500a" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="M26 46c-11 9-14 21-12 30 7-3 11-10 13-18z" fill="#2e2e38" stroke="#17171d" stroke-width="3" stroke-linejoin="round"></path>
<path d="M74 46c11 9 14 21 12 30-7-3-11-10-13-18z" fill="#2e2e38" stroke="#17171d" stroke-width="3" stroke-linejoin="round"></path>
<path d="M50 8c16 0 26 14 26 34v26c0 14-12 22-26 22S24 82 24 68V42C24 22 34 8 50 8z" fill="#2e2e38" stroke="#17171d" stroke-width="3"></path>
<path d="M50 32c10 0 16 9 16 21v13c0 10-7 16-16 16s-16-6-16-16V53c0-12 6-21 16-21z" fill="#f1eef7"></path>
<circle cx="42" cy="24" r="4.5" fill="#ffffff"></circle><circle cx="58" cy="24" r="4.5" fill="#ffffff"></circle>
<circle cx="43" cy="24.5" r="2.4" fill="#2e2e38"></circle><circle cx="57" cy="24.5" r="2.4" fill="#2e2e38"></circle>
<path d="M44 31h12l-6 7z" fill="#ffc21a" stroke="#d48a00" stroke-width="2" stroke-linejoin="round"></path>
</svg>
</sc-if>
</button>
</sc-if>

<sc-if value="{{showPlayArea}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; margin-top: 10px; {{slotrow}}">
<sc-for list="{{slots}}" as="sl" hint-placeholder-count="3">
<div style="display: grid; place-items: center; font-weight: 800; box-sizing: border-box; flex-shrink: 0; {{sl.style}}">{{sl.ch}}</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showPlayArea}}" hint-placeholder-val="{{ true }}">
<div style="width: 100%; display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; align-items: center; gap: 10px;">
<div style="display: grid;">
<sc-if value="{{showOffer}}" hint-placeholder-val="{{ false }}">
<button class="bw-appear" onClick="{{swap}}" aria-label="New word" style="border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #063510; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h12M13 5l3 3-3 3"></path><path d="M20 16H8M11 13l-3 3 3 3"></path></svg>
</button>
</sc-if>
</div>
<p role="status" style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; color: #c9c2ff; min-height: 24px; text-align: center; text-wrap: balance;">{{help}}</p>
<button onClick="{{hint}}" aria-label="Hint, {{hintsLeft}} left" aria-disabled="{{hintOff}}" style="position: relative; border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #5a3500; background: linear-gradient(180deg, #ffe266, #ffc21a); box-shadow: 0 5px 0 #d48a00; opacity: {{hintopacity}};">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
<span aria-hidden="true" style="position: absolute; right: -6px; bottom: -6px; min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 8px; background: #d92f45; border: 2px solid #ffffff; color: #ffffff; font-size: 13px; line-height: 20px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums;">{{hintsLeft}}</span>
</button>
</div>
</sc-if>

<div style="flex-grow: 1;"></div>

<div style="width: 100%; box-sizing: border-box; padding: 18px 12px; border-radius: 28px; background: #1d1550; box-shadow: inset 0 4px 10px rgba(0,0,0,0.45); display: flex; justify-content: center;">
<div style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap; {{traybox}}">
<sc-if value="{{showTray}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{tray}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.tap}}" aria-label="Letter {{t.ch}}" style="position: relative; border: 0; cursor: pointer; font-family: inherit; padding: 0; font-weight: 800; color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); transition: transform 0.12s, opacity 0.2s; {{t.style}}">
<span style="position: absolute; border-radius: 5px 5px 0 0; {{t.studl}}"></span>
<span style="position: absolute; border-radius: 5px 5px 0 0; {{t.studr}}"></span>
{{t.ch}}
</button>
</sc-for>
</sc-if>
<sc-if value="{{showNext}}" hint-placeholder-val="{{ false }}">
<button class="bw-appear" onClick="{{next}}" style="border: 0; cursor: pointer; font-family: inherit; min-width: 220px; height: 58px; padding: 0 20px; box-sizing: border-box; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; color: #063510; font-size: 20px; font-weight: 800; line-height: 1.15; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26;">Next word<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"></path></svg></button>
</sc-if>
</div>
</div>

<sc-if value="{{cardOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(10,6,30,0.65); display: grid; place-items: center; padding: 16px;">
<div class="bw-card" role="dialog" aria-modal="true" aria-labelledby="lb-card-title" aria-describedby="lb-card-fact" style="width: 100%; max-width: 330px; box-sizing: border-box; text-align: center; padding: 24px 20px 20px; border-radius: 26px; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 8px 0 #241a63; color: #ffffff;">
<h2 id="lb-card-title" style="margin: 0; font-size: 32px; font-weight: 800; line-height: 1.1; text-wrap: balance;">{{cardTitle}}</h2>
<div role="img" aria-label="{{starsLabel}}" style="display: flex; justify-content: center; align-items: center; gap: {{starsgap}}px; margin: 10px 0;">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="3">
<svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z" fill="{{s.fill}}"></path></svg>
</sc-for>
<sc-if value="{{showTotal}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="font-size: 24px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">{{totalText}}</span>
</sc-if>
</div>
<p id="lb-card-fact" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; text-wrap: balance;">{{cardFact}}</p>
<sc-if value="{{showRule}}" hint-placeholder-val="{{ true }}">
<p style="margin: 6px 0 0; font-size: 14px; font-weight: 700; line-height: 1.35; text-wrap: balance;">3 stars: 1 slip or none. 2 stars: 4 slips or fewer.</p>
</sc-if>
<sc-if value="{{showCap}}" hint-placeholder-val="{{ false }}">
<p style="margin: 6px 0 0; font-size: 14px; font-weight: 700; line-height: 1.35; text-wrap: balance;">Using a hint caps the level at 2 stars.</p>
</sc-if>
<sc-if value="{{showNote}}" hint-placeholder-val="{{ false }}">

</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"stage":{"editor":"enum","options":["starter","growing","advanced"],"default":"starter"},"puzzle":{"editor":"enum","options":["1","2","3","4"],"default":"3"},"moment":{"editor":"enum","options":["play","solved","stuck","levelDone","gameDone"],"default":"play"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fromLever();
  }
  stageOf(props) {
    var st = props && props.stage;
    return st === 'growing' || st === 'advanced' ? st : 'starter';
  }
  // Spelling levels (Spell it, Levels 16 to 24) with four words each. Children and words are sample data;
  // word lengths follow each child's age band. Stuck limits from brief 3.1: wrong taps, then seconds with no right tap.
  stages() {
    return {
      starter: {
        level: 16, kid: 'Leo', initial: 'L', color: '#ffab5e', wrongLimit: 3, secsLimit: 30, // ages 3 to 4
        words: ['SUN', 'BUS', 'BOX', 'CAT']
      },
      growing: {
        level: 17, kid: 'Nia', initial: 'N', color: '#14c8c0', wrongLimit: 3, secsLimit: 40, // ages 5 to 6
        words: ['FISH', 'FROG', 'HOUSE', 'DUCK']
      },
      advanced: {
        level: 24, kid: 'Maya', initial: 'M', color: '#2f8cff', wrongLimit: 4, secsLimit: 50, // ages 7 to 8; Level 24 is the last level
        words: ['ROCKET', 'RAINBOW', 'UMBRELLA', 'PENGUIN']
      }
    };
  }
  leverKey() {
    var p = this.props || {};
    return [this.stageOf(p), p.puzzle, p.moment].join('|');
  }
  // A fresh word: the run's word order, solved count and hints stay with the caller.
  freshWord() { return { filled: 0, used: {}, wrong: null, wrongTaps: 0, idle: 0, offer: false, note: '', hintIdx: null }; }
  fromLever() {
    var p = this.props || {};
    var stage = this.stageOf(p);
    var S = this.stages()[stage];
    var puzzle = Math.min(4, Math.max(1, parseInt(p.puzzle, 10) || 3));
    var moment = ['play', 'solved', 'stuck', 'levelDone', 'gameDone'].indexOf(p.moment) >= 0 ? p.moment : 'play';
    if (moment === 'solved' && puzzle === 4) moment = 'levelDone';
    if (moment === 'levelDone' || moment === 'gameDone') puzzle = 4;
    var s = Object.assign(this.freshWord(), { lever: this.leverKey(), stage: stage, level: S.level, puzzle: puzzle, moment: moment, order: [0, 1, 2, 3], shuffle: 0, slips: 1, hintsLeft: 3, usedHint: false });
    var word = S.words[s.order[puzzle - 1]];
    if (moment === 'solved' || moment === 'levelDone' || moment === 'gameDone') {
      s.filled = word.length;
      word.split('').forEach(function (ch, i) { s.used[i] = true; });
    }
    if (moment === 'stuck') { s.moment = 'play'; s.filled = 1; s.wrongTaps = S.wrongLimit; s.slips = S.wrongLimit; s.offer = true; }
    return s;
  }
  // The state to render: the last interaction, unless a lever changed since.
  st() {
    var key = this.leverKey();
    if (this.pending && this.pending.lever === key) return this.pending;
    if (this.state && this.state.lever === key) return this.state;
    this.pending = this.fromLever();
    return this.pending;
  }
  put(patch) {
    var next = Object.assign({}, this.st(), patch, { lever: this.leverKey() });
    this.pending = next;
    this.setState(next);
  }
  componentDidMount() {
    var self = this;
    // The time signal: seconds with no right tap, counted only while the word is on screen (brief 3.1).
    this.timer = setInterval(function () {
      var s = self.st();
      if (s.moment !== 'play') return;
      var idle = s.idle + 1;
      self.put({ idle: idle, offer: s.offer || idle === self.stages()[s.stage].secsLimit });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.cardT); clearTimeout(this.wrongT); }
  // One tile per letter of the word, shuffled the same way every time, never in spelling order.
  shuffled(word, extra) {
    var a = word.split('');
    var seed = 7 + (extra || 0) * 13;
    for (var k = 0; k < word.length; k++) seed = (seed * 31 + word.charCodeAt(k)) % 2147483647;
    for (var i = a.length - 1; i > 0; i--) {
      seed = (seed * 16807) % 2147483647;
      var j = seed % (i + 1);
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    if (a.join('') === word) a.push(a.shift());
    return a;
  }
  // Slot and tile sizes come from the word length and the inner width.
  sizes(n, innerW) {
    var avail = innerW - 32;
    var sGap = n <= 4 ? 12 : n <= 6 ? 8 : 6;
    var sw = Math.min(76, Math.floor((avail - sGap * (n - 1)) / n));
    var trayW = avail - 24;
    var gap = 12;
    var perRow = n;
    var tw = Math.floor((trayW - gap * (n - 1)) / n);
    if (tw >= 70) tw = 70;
    else if (tw < 56) {
      perRow = Math.ceil(n / 2);
      tw = Math.min(70, Math.floor((trayW - gap * (perRow - 1)) / perRow));
    }
    return {
      sw: sw, sh: Math.round(sw * 84 / 76), sGap: sGap,
      sFont: Math.round(sw * 46 / 76), sRad: Math.max(8, Math.round(sw * 18 / 76)), sBorder: sw < 56 ? 2 : 3,
      tw: tw, th: Math.round(tw * 74 / 70), tFont: Math.round(tw * 40 / 70), tRad: Math.round(tw * 14 / 70),
      studW: Math.round(tw * 18 / 70), studH: Math.max(7, Math.round(tw * 10 / 70)), studIn: Math.round(tw * 12 / 70),
      gap: gap, rowGap: 18, perRow: perRow, rows: Math.ceil(n / perRow),
      rowW: perRow * tw + (perRow - 1) * gap, slotRowW: n * sw + (n - 1) * sGap, avail: avail, trayW: trayW

  colorOf(ch) {
    var map = {
      A: 'green', B: 'blue', C: 'yellow', D: 'yellow', E: 'pink', F: 'green', G: 'teal', H: 'blue', I: 'yellow',
      K: 'blue', L: 'teal', M: 'pink', N: 'orange', O: 'red', P: 'purple', R: 'orange', S: 'teal', T: 'green', U: 'purple',
      W: 'teal', X: 'pink'
    };
    return map[ch] || 'blue';
  }
  pal() {
    return {
      red: ['#f03a3a', '#ff7a6e', '#b51f27'], yellow: ['#ffc21a', '#ffe266', '#d48a00'],
      green: ['#1fb53c', '#5fe06e', '#0f7a26'], blue: ['#2f8cff', '#7cc0ff', '#1557c4'],
      purple: ['#9b4dff', '#c79bff', '#6624c9'], orange: ['#ff7a1a', '#ffab5e', '#c4500a'],
      pink: ['#ff5fb4', '#ff9fd4', '#c72f84'], teal: ['#14c8c0', '#6aeee4', '#0b8c87']
    };
  }
  face(color) {
    var p = this.pal()[color];
    return 'background: linear-gradient(160deg, ' + p[1] + ' -30%, ' + p[0] + ' 45%, ' + p[2] + ' 140%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -5px 0 rgba(0,0,0,0.22), 0 4px 0 rgba(0,0,0,0.3);';
  }
  say(text) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  renderVals() {
    var self = this;
    var s = this.st();
    var S = this.stages()[s.stage];
    var tablet = this.props.device === 'tablet';
    var IW = tablet ? 596 : 390;
    var word = S.words[s.order[s.puzzle - 1]];
    var trayLetters = this.shuffled(word, s.shuffle);
    var z = this.sizes(word.length, IW);
    var m = s.moment;
    var finished = m === 'gameDone';
    var solvedNow = m === 'solved' || m === 'lastSolved' || m === 'levelDone' || finished;
    var playing = m === 'play';
    var lastLevel = S.level === 24;
    var helpText = solvedNow ? 'You built ' + word + '.'
      : s.offer ? 'This word is tricky. Want a different one?'
      : s.wrong !== null ? 'Not that one. Listen again: ' + word.toLowerCase() + '!'
      : s.note ? s.note
      : s.filled === 0 ? 'Tap the letters to build the word.' : 'What comes next?';

    // Dots (brief 7.1, 8). Spelling levels count words built.
    var built = s.puzzle - 1 + (solvedNow ? 1 : 0);
    var dots = [1, 2, 3, 4].map(function (i) {
      var isCur = i === s.puzzle;
      var filled = i < s.puzzle || (isCur && solvedNow);
      return { w: isCur ? 32 : 22, bg: isCur ? '#7cc0ff' : '#1d1550', ring: isCur || filled ? 'none' : 'inset 0 0 0 2px #8e85d6', fill: filled ? 1 : 0 };
    });

    // Level card: slips over the 4 words (brief 5). A hint caps the level at 2 stars.
    var base = s.slips <= 1 ? 3 : s.slips <= 4 ? 2 : 1;
    var starsWon = finished ? 3 : s.usedHint ? Math.min(2, base) : base;
    var fact = s.slips === 0 ? '4 words, no slips.' : s.slips === 1 ? '4 words, 1 slip.' : '4 words, ' + s.slips + ' slips.';
    var trayMinH = z.rows * z.th + (z.rows - 1) * z.rowGap;
    var canHint = playing && s.hintsLeft > 0;

    return {
      w: tablet ? 834 : 390, h: tablet ? 1194 : 844, z: tablet ? 1.4 : 1, iw: IW, ih: tablet ? 853 : 844,
      hubHref: tablet ? 'HubTablet.dc.html' : 'Hub.dc.html',
      title: finished ? 'Letter Builder' : 'Level ' + s.level,
      showDots: !finished, dots: dots,
      dotsLabel: built === 4 ? '4 of 4 built.' : 'Word ' + s.puzzle + ' of 4. ' + built + ' built.',
      showPlayArea: !finished,
      kidLine: S.kid, kidInitial: S.initial, kidcolor: S.color,
      word: word.toLowerCase(),
      isSun: word === 'SUN', isBus: word === 'BUS', isBox: word === 'BOX', isCat: word === 'CAT',
      isFish: word === 'FISH', isFrog: word === 'FROG', isHouse: word === 'HOUSE', isDuck: word === 'DUCK',
      isRocket: word === 'ROCKET', isRainbow: word === 'RAINBOW', isUmbrella: word === 'UMBRELLA', isPenguin: word === 'PENGUIN',
      // Speech only after a tap. While the offer shows, the speaker reads the offer line (brief 10).
      speakLabel: s.offer ? 'Read the help line aloud' : 'Say the word',
      speak: function () { self.say(self.st().offer ? 'This word is tricky. Want a different one?' : word.toLowerCase()); },
      sayWord: function () { self.say(word.toLowerCase()); },
      slotrow: 'gap: ' + z.sGap + 'px;',
      slots: word.split('').map(function (ch, i) {
        var done = i < s.filled;
        var box = 'width: ' + z.sw + 'px; height: ' + z.sh + 'px; border-radius: ' + z.sRad + 'px; font-size: ' + z.sFont + 'px; ';
        return {
          ch: done ? ch : '',
          style: box + (done
            ? self.face(self.colorOf(ch)) + ' color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.3);'
            : 'border: ' + z.sBorder + 'px dashed ' + (i === s.filled ? '#ffc21a' : '#5444b8') + '; background: rgba(0,0,0,0.15);')
        };
      }),
      help: helpText,
      showOffer: playing && s.offer,
      swap: function () {
        var cs = self.st();
        // The current word moves to the end of the unsolved ones; the dots stay where they are (brief 3.3).
        var order = cs.order.slice(0, cs.puzzle - 1).concat(cs.order.slice(cs.puzzle), [cs.order[cs.puzzle - 1]]);
        self.put(Object.assign(self.freshWord(), { order: order, shuffle: cs.shuffle + 1, note: 'Here is a different word.' }));
      },
      hintsLeft: s.hintsLeft,
      hintOff: canHint ? 'false' : 'true',
      hintopacity: canHint ? 1 : 0.45,
      hint: function () {
        var cs = self.st();
        if (cs.moment !== 'play' || cs.hintsLeft <= 0) return;
        var target = word.charAt(cs.filled);
        var idx = trayLetters.findIndex(function (ch, i) { return !cs.used[i] && ch === target; });
        if (idx < 0) return;
        self.put({ hintIdx: idx, hintsLeft: cs.hintsLeft - 1, usedHint: true });
      },
      traybox: 'width: ' + z.rowW + 'px; min-height: ' + trayMinH + 'px; column-gap: ' + z.gap + 'px; row-gap: ' + z.rowGap + 'px;',
      showTray: !solvedNow,
      tray: trayLetters.map(function (ch, i) {
        var used = !!s.used[i];
        var p = self.pal()[self.colorOf(ch)];
        var stud = 'top: -' + (z.studH - 2) + 'px; width: ' + z.studW + 'px; height: ' + z.studH + 'px; background: ' + p[1] + ';';
        var box = 'width: ' + z.tw + 'px; height: ' + z.th + 'px; border-radius: ' + z.tRad + 'px; font-size: ' + z.tFont + 'px; ';
        var lit = s.hintIdx === i && !used ? ' outline: 4px solid #ffc21a; outline-offset: 3px;' : '';
        return {
          ch: ch,
          studl: stud + ' left: ' + z.studIn + 'px;',
          studr: stud + ' right: ' + z.studIn + 'px;',
          style: box + self.face(self.colorOf(ch)) + lit + (used ? ' opacity: 0.2; transform: scale(0.85);' : s.wrong === i ? ' transform: translateX(-8px) rotate(-6deg);' : ' transform: rotate(' + (i % 2 ? 3 : -3) + 'deg);'),
          tap: function () {
            var cs = self.st();
            if (used || cs.moment !== 'play') return;
            if (ch === word.charAt(cs.filled)) {
              self.say(ch);
              var u = Object.assign({}, cs.used);
              u[i] = true;
              var filled = cs.filled + 1;
              var done = filled === word.length;
              // A right tap is progress: it hides the offer and resets the time signal (brief 3.2).
              var patch = { filled: filled, used: u, wrong: null, idle: 0, offer: false, note: '', hintIdx: null };
              if (done) patch.moment = cs.puzzle < 4 ? 'solved' : 'lastSolved';
              self.put(patch);
              if (done && cs.puzzle === 4) { clearTimeout(self.cardT); self.cardT = setTimeout(function () { self.put({ moment: 'levelDone' }); }, 600); }
            } else {
              var wrongTaps = cs.wrongTaps + 1;
              self.put({ wrong: i, slips: cs.slips + 1, wrongTaps: wrongTaps, offer: cs.offer || wrongTaps >= S.wrongLimit });
              clearTimeout(self.wrongT);
              self.wrongT = setTimeout(function () { self.put({ wrong: null }); }, 400);
            }
          }
        };
      }),
      showNext: m === 'solved',
      next: function () { var cs = self.st(); self.put(Object.assign(self.freshWord(), { puzzle: cs.puzzle + 1, moment: 'play' })); },
      cardOpen: m === 'levelDone' || finished,
      cardTitle: finished || lastLevel ? 'You finished every level!' : 'You finished Level ' + s.level,
      // Every level done (decision D6): one star and the game's total, never the last level's star row.
      stars: finished ? [{ fill: '#ffb21f' }] : [0, 1, 2].map(function (i) { return { fill: i < starsWon ? '#ffb21f' : 'rgba(0,0,0,0.3)' }; }),
      starsLabel: finished ? '60 of 72 stars' : starsWon + ' of 3 stars',
      starsgap: finished ? 6 : 4,
      showTotal: finished,
      totalText: '60 of 72',
      // The every-level totals are sample data.
      cardFact: finished || lastLevel ? '24 levels, 60 of 72 stars.' : fact,
      showRule: !finished && !lastLevel,
      showCap: !finished && !lastLevel && s.usedHint,
      showNote: finished,
      showPlayNext: !finished && !lastLevel,
      showFinal: finished || lastLevel,
      playLabel: 'Play Level ' + (s.level + 1),
      playNext: function () {
        var cs = self.st();
        self.put(Object.assign(self.freshWord(), { level: cs.level + 1, puzzle: 1, moment: 'play', order: [0, 1, 2, 3], shuffle: cs.shuffle + 1, slips: 0, hintsLeft: 3, usedHint: false }));
      }
    };
  }
}
