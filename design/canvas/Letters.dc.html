<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letter Builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{W}}px; height: {{H}}px; overflow: hidden; background: radial-gradient(120% 80% at 50% 15%, #33278a, #1a1246); font-family: 'Baloo 2', system-ui, sans-serif; color: #ffffff;">
<div style="zoom: {{Z}}; width: {{IW}}px; height: {{IH}}px; box-sizing: border-box; padding: 20px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative;">

<div style="width: 100%; display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 10px;">
<a href="{{hubHref}}" aria-label="Back to home" style="width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="text-align: center; line-height: 1.1;">
<div style="font-size: 24px; font-weight: 800;">Spell it</div>
<div style="font-size: 15px; font-weight: 700; color: #c9c2ff;">Letter Builder · {{levelLabel}}</div>
</div>
<button onClick="{{speak}}" aria-label="Say the word" style="border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9.5a3.5 3.5 0 0 1 0 5"></path><path d="M19 7a7 7 0 0 1 0 10"></path></svg>
</button>
</div>

<div style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 14px; box-sizing: border-box; border-radius: 18px; background: #30257a;">
<span style="width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: {{kidColor}}; color: #ffffff; font-size: 18px; font-weight: 800;">{{kidInitial}}</span>
<span style="display: flex; flex-direction: column; line-height: 1.1; flex-grow: 1;">
<span style="font-size: 16px; font-weight: 800;">{{kidLine}}</span>
<span style="font-size: 13px; font-weight: 700; color: #c9c2ff;">{{kidNote}}</span>
</span>
<div style="display: flex; gap: 5px;" aria-label="Word {{roundNo}} of 3">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
<span style="width: 22px; height: 10px; border-radius: 999px; background: {{d.fill}};"></span>
</sc-for>
</div>
</div>

<button onClick="{{speak}}" aria-label="Picture of a {{word}}, tap to hear it" style="border: 0; cursor: pointer; margin-top: 10px; width: 230px; height: 190px; border-radius: 36px; display: grid; place-items: center; background: linear-gradient(180deg, #4a3ca8, #30257a); box-shadow: inset 0 0 0 4px #5444b8, 0 8px 0 #241a63;">
<sc-if value="{{isSun}}" hint-placeholder-val="{{ true }}">
<svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
<g stroke="#ffc21a" stroke-width="7" stroke-linecap="round"><path d="M50 6v12M50 82v12M6 50h12M82 50h12M19 19l8 8M73 73l8 8M81 19l-8 8M27 73l-8 8"></path></g>
<circle cx="50" cy="50" r="24" fill="#ffc21a"></circle><circle cx="50" cy="50" r="24" fill="none" stroke="#d48a00" stroke-width="3"></circle>
<circle cx="42" cy="46" r="3.5" fill="#5a3500"></circle><circle cx="58" cy="46" r="3.5" fill="#5a3500"></circle>
<path d="M41 57c5 5 13 5 18 0" fill="none" stroke="#5a3500" stroke-width="3.5" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{isBus}}" hint-placeholder-val="{{ false }}">
<svg width="170" height="130" viewBox="0 0 120 90" aria-hidden="true">
<rect x="8" y="12" width="104" height="56" rx="12" fill="#ffc21a" stroke="#d48a00" stroke-width="3"></rect>
<rect x="18" y="22" width="20" height="18" rx="4" fill="#7cc0ff"></rect><rect x="44" y="22" width="20" height="18" rx="4" fill="#7cc0ff"></rect><rect x="70" y="22" width="20" height="18" rx="4" fill="#7cc0ff"></rect>
<rect x="95" y="22" width="10" height="36" rx="3" fill="#7cc0ff"></rect>
<rect x="8" y="48" width="104" height="6" fill="#d48a00"></rect>
<circle cx="32" cy="70" r="11" fill="#2e2e38"></circle><circle cx="32" cy="70" r="4" fill="#b9b3c9"></circle>
<circle cx="88" cy="70" r="11" fill="#2e2e38"></circle><circle cx="88" cy="70" r="4" fill="#b9b3c9"></circle>
</svg>
</sc-if>
<sc-if value="{{isBox}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="140" viewBox="0 0 100 94" aria-hidden="true">
<path d="M10 30l40-18 40 18-40 18z" fill="#e0a45e"></path>
<path d="M10 30v40l40 18V48z" fill="#c4802f"></path>
<path d="M90 30v40L50 88V48z" fill="#a8681f"></path>
<path d="M30 21l40 18v14" fill="none" stroke="#f1eef7" stroke-width="6"></path>
</svg>
</sc-if>
<sc-if value="{{isFish}}" hint-placeholder-val="{{ false }}">
<svg width="170" height="130" viewBox="0 0 120 90" aria-hidden="true">
<path d="M42 24c6-12 22-14 30-2" fill="#ffab5e" stroke="#c4500a" stroke-width="3" stroke-linejoin="round"></path>
<path d="M86 45l26-21v42z" fill="#ff7a1a" stroke="#c4500a" stroke-width="3" stroke-linejoin="round"></path>
<ellipse cx="52" cy="45" rx="40" ry="26" fill="#ff7a1a" stroke="#c4500a" stroke-width="3"></ellipse>
<path d="M46 27c-5 12-5 24 0 36" fill="none" stroke="#c4500a" stroke-width="3" stroke-linecap="round"></path>
<circle cx="30" cy="40" r="5.5" fill="#ffffff"></circle><circle cx="29" cy="40" r="3" fill="#2e2e38"></circle>
<path d="M15 50c3 2.5 6 2.5 9 0" fill="none" stroke="#c4500a" stroke-width="3" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{isFrog}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="140" viewBox="0 0 100 94" aria-hidden="true">
<circle cx="31" cy="30" r="14" fill="#1fb53c" stroke="#0f7a26" stroke-width="3"></circle>
<circle cx="69" cy="30" r="14" fill="#1fb53c" stroke="#0f7a26" stroke-width="3"></circle>
<ellipse cx="50" cy="60" rx="40" ry="28" fill="#1fb53c" stroke="#0f7a26" stroke-width="3"></ellipse>
<ellipse cx="50" cy="72" rx="22" ry="11" fill="#5fe06e"></ellipse>
<circle cx="31" cy="29" r="8" fill="#ffffff"></circle><circle cx="69" cy="29" r="8" fill="#ffffff"></circle>
<circle cx="32" cy="30" r="4" fill="#2e2e38"></circle><circle cx="68" cy="30" r="4" fill="#2e2e38"></circle>
<path d="M32 52c10 9 26 9 36 0" fill="none" stroke="#0f7a26" stroke-width="3.5" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{isHouse}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="140" viewBox="0 0 100 94" aria-hidden="true">
<rect x="66" y="18" width="10" height="20" fill="#b51f27"></rect>
<rect x="20" y="44" width="60" height="42" rx="3" fill="#ffe266" stroke="#d48a00" stroke-width="3"></rect>
<path d="M10 47L50 13l40 34z" fill="#f03a3a" stroke="#b51f27" stroke-width="3" stroke-linejoin="round"></path>
<rect x="27" y="56" width="13" height="13" rx="2" fill="#7cc0ff"></rect><rect x="60" y="56" width="13" height="13" rx="2" fill="#7cc0ff"></rect>
<rect x="43" y="62" width="14" height="24" rx="3" fill="#c4802f"></rect>
</svg>
</sc-if>
<sc-if value="{{isRocket}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
<path d="M42 78q8 20 16 0z" fill="#ffc21a"></path><path d="M46 78q4 11 8 0z" fill="#ff7a1a"></path>
<path d="M36 54L20 80l16-5z" fill="#f03a3a" stroke="#b51f27" stroke-width="3" stroke-linejoin="round"></path>
<path d="M64 54l16 26-16-5z" fill="#f03a3a" stroke="#b51f27" stroke-width="3" stroke-linejoin="round"></path>
<path d="M50 8c14 12 18 34 16 70H34C32 42 36 20 50 8z" fill="#f1eef7"></path>
<path d="M50 8c6 5 10 11 12 19H38c2-8 6-14 12-19z" fill="#f03a3a"></path>
<path d="M50 8c14 12 18 34 16 70H34C32 42 36 20 50 8z" fill="none" stroke="#b9b3c9" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="50" cy="46" r="9" fill="#7cc0ff" stroke="#2f8cff" stroke-width="3"></circle>
</svg>
</sc-if>
<sc-if value="{{isRainbow}}" hint-placeholder-val="{{ false }}">
<svg width="170" height="130" viewBox="0 0 120 90" aria-hidden="true">
<g fill="none" stroke-width="8">
<path d="M14 70a46 46 0 0 1 92 0" stroke="#f03a3a"></path>
<path d="M22 70a38 38 0 0 1 76 0" stroke="#ffc21a"></path>
<path d="M30 70a30 30 0 0 1 60 0" stroke="#1fb53c"></path>
<path d="M38 70a22 22 0 0 1 44 0" stroke="#2f8cff"></path>
<path d="M46 70a14 14 0 0 1 28 0" stroke="#9b4dff"></path>
</g>
<g fill="#f1eef7">
<circle cx="10" cy="74" r="9"></circle><circle cx="21" cy="68" r="11"></circle><circle cx="31" cy="76" r="8"></circle><rect x="6" y="74" width="28" height="10" rx="5"></rect>
<circle cx="110" cy="74" r="9"></circle><circle cx="99" cy="68" r="11"></circle><circle cx="89" cy="76" r="8"></circle><rect x="86" y="74" width="28" height="10" rx="5"></rect>
</g>
</svg>
</sc-if>
<sc-if value="{{isUmbrella}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
<path d="M50 46v38a8 8 0 0 1-16 0" fill="none" stroke="#ffc21a" stroke-width="6" stroke-linecap="round"></path>
<path d="M8 50A42 40 0 0 1 92 50q-7-8-14 0q-7-8-14 0q-7-8-14 0q-7-8-14 0q-7-8-14 0q-7-8-14 0z" fill="#f03a3a" stroke="#b51f27" stroke-width="3" stroke-linejoin="round"></path>
<path d="M50 10q-14 16-14 40M50 10q14 16 14 40M50 10v40" fill="none" stroke="#b51f27" stroke-width="3" stroke-linecap="round"></path>
<circle cx="50" cy="8" r="3.5" fill="#b51f27"></circle>
</svg>
</sc-if>
</button>

<div style="display: flex; margin-top: 10px; {{slotRow}}">
<sc-for list="{{slots}}" as="sl" hint-placeholder-count="3">
<div style="display: grid; place-items: center; font-weight: 800; box-sizing: border-box; flex-shrink: 0; {{sl.style}}">{{sl.ch}}</div>
</sc-for>
</div>

<p style="margin: 0; font-size: 17px; font-weight: 700; color: #c9c2ff; min-height: 24px; text-align: center;">{{help}}</p>

<div style="flex-grow: 1;"></div>

<div style="width: 100%; box-sizing: border-box; padding: 18px 12px; border-radius: 28px; background: #1d1550; box-shadow: inset 0 4px 10px rgba(0,0,0,0.45); display: flex; justify-content: center;">
<div style="display: flex; justify-content: center; flex-wrap: wrap; {{trayBox}}">
<sc-for list="{{tray}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.tap}}" aria-label="Letter {{t.ch}}" style="position: relative; border: 0; cursor: pointer; font-family: inherit; padding: 0; font-weight: 800; color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); transition: transform 0.12s, opacity 0.2s; {{t.style}}">
<span style="position: absolute; border-radius: 5px 5px 0 0; {{t.studL}}"></span>
<span style="position: absolute; border-radius: 5px 5px 0 0; {{t.studR}}"></span>
{{t.ch}}
</button>
</sc-for>
</div>
</div>

<sc-if value="{{roundDone}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(10,6,30,0.6); display: grid; place-items: center; padding: 16px;">
<div style="width: 100%; max-width: 330px; box-sizing: border-box; text-align: center; padding: 24px 20px 20px; border-radius: 26px; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 8px 0 #241a63;">
<div style="font-size: 32px; font-weight: 800; line-height: 1.1;">{{doneTitle}}</div>
<div style="font-size: 18px; font-weight: 700; color: #c9c2ff; margin: 8px 0 14px;">{{doneText}}</div>
<button onClick="{{next}}" style="border: 0; cursor: pointer; font-family: inherit; color: #ffffff; font-size: 20px; font-weight: 800; padding: 12px 28px; border-radius: 16px; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26;">{{nextLabel}}</button>
</div>
</div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"stage":{"editor":"enum","options":["starter","growing","advanced"],"default":"starter"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh(this.stageOf(props));
  }
  fresh(stage) {
    return { stage: stage, round: 0, filled: 0, used: {}, wrong: null, slips: 0, roundDone: false };
  }
  stageOf(props) {
    var st = props && props.stage;
    return st === 'growing' || st === 'advanced' ? st : 'starter';
  }
  stages() {
    return {
      starter: {
        level: 'Level 3', kid: 'Leo, age 4 · Relaxed play', initial: 'L', color: '#ffab5e',
        note: 'No countdown. The sand just shows you are doing great.',
        words: ['SUN', 'BUS', 'BOX']
      },
      growing: {
        level: 'Level 17', kid: 'Nia, age 6 · Gentle timer', initial: 'N', color: '#14c8c0',
        note: 'Double time on every word. Run out and you can still finish.',
        words: ['FISH', 'FROG', 'HOUSE']
      },
      advanced: {
        level: 'Level 32', kid: 'Maya, age 7 · Standard timer', initial: 'M', color: '#2f8cff',
        note: 'Time grows with each level. Longer words get more time.',
        words: ['ROCKET', 'RAINBOW', 'UMBRELLA']
      }
    };
  }
  // One tile per letter of the word, shuffled the same way every time, never in spelling order.
  shuffled(word) {
    var a = word.split('');
    var seed = 7;
    for (var k = 0; k < word.length; k++) seed = (seed * 31 + word.charCodeAt(k)) % 2147483647;
    for (var i = a.length - 1; i > 0; i--) {
      seed = (seed * 16807) % 2147483647;
      var j = seed % (i + 1);
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    if (a.join('') === word) a.push(a.shift());
    return a;
  }
  // Slot and tile sizes come from the word length and the inner width.
  sizes(n, innerW) {
    var avail = innerW - 32;
    var sGap = n <= 4 ? 12 : n <= 6 ? 8 : 6;
    var sw = Math.min(76, Math.floor((avail - sGap * (n - 1)) / n));
    var trayW = avail - 24;
    var gap = 12;
    var perRow = n;
    var tw = Math.floor((trayW - gap * (n - 1)) / n);
    if (tw >= 70) tw = 70;
    else if (tw < 56) {
      perRow = Math.ceil(n / 2);
      tw = Math.min(70, Math.floor((trayW - gap * (perRow - 1)) / perRow));
    }
    return {
      sw: sw, sh: Math.round(sw * 84 / 76), sGap: sGap,
      sFont: Math.round(sw * 46 / 76), sRad: Math.max(8, Math.round(sw * 18 / 76)), sBorder: sw < 56 ? 2 : 3,
      tw: tw, th: Math.round(tw * 74 / 70), tFont: Math.round(tw * 40 / 70), tRad: Math.round(tw * 14 / 70),
      studW: Math.round(tw * 18 / 70), studH: Math.max(7, Math.round(tw * 10 / 70)), studIn: Math.round(tw * 12 / 70),
      gap: gap, rowGap: 18, perRow: perRow, rows: Math.ceil(n / perRow),
      rowW: perRow * tw + (perRow - 1) * gap, slotRowW: n * sw + (n - 1) * sGap, avail: avail, trayW: trayW
    };
  }
  colorOf(ch) {
    var map = {
      A: 'green', B: 'blue', C: 'yellow', D: 'yellow', E: 'pink', F: 'green', G: 'teal', H: 'blue', I: 'yellow',
      K: 'blue', L: 'teal', M: 'pink', N: 'orange', O: 'red', R: 'orange', S: 'teal', T: 'green', U: 'purple',
      W: 'teal', X: 'pink'
    };
    return map[ch] || 'blue';
  }
  pal() {
    return {
      red: ['#f03a3a', '#ff7a6e', '#b51f27'], yellow: ['#ffc21a', '#ffe266', '#d48a00'],
      green: ['#1fb53c', '#5fe06e', '#0f7a26'], blue: ['#2f8cff', '#7cc0ff', '#1557c4'],
      purple: ['#9b4dff', '#c79bff', '#6624c9'], orange: ['#ff7a1a', '#ffab5e', '#c4500a'],
      pink: ['#ff5fb4', '#ff9fd4', '#c72f84'], teal: ['#14c8c0', '#6aeee4', '#0b8c87']
    };
  }
  face(color) {
    var p = this.pal()[color];
    return 'background: linear-gradient(160deg, ' + p[1] + ' -30%, ' + p[0] + ' 45%, ' + p[2] + ' 140%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -5px 0 rgba(0,0,0,0.22), 0 4px 0 rgba(0,0,0,0.3);';
  }
  say(text) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  renderVals() {
    var self = this;
    var stage = this.stageOf(this.props);
    var S = this.stages()[stage];
    // A new stage starts again from word 1, without calling setState during render.
    var s = this.state.stage === stage ? this.state : this.fresh(stage);
    var last = S.words.length - 1;
    var round = Math.min(Math.max(s.round, 0), last);
    var tablet = this.props.device === 'tablet';
    var IW = tablet ? 596 : 390;
    var word = S.words[round];
    var trayLetters = this.shuffled(word);
    var z = this.sizes(word.length, IW);
    return {
      W: tablet ? 834 : 390, H: tablet ? 1194 : 844, Z: tablet ? 1.4 : 1, IW: IW, IH: tablet ? 853 : 844,
      hubHref: tablet ? 'HubTablet.dc.html' : 'Hub.dc.html',
      levelLabel: S.level,
      kidLine: S.kid, kidNote: S.note, kidInitial: S.initial, kidColor: S.color,
      word: word.toLowerCase(),
      roundNo: round + 1,
      isSun: word === 'SUN', isBus: word === 'BUS', isBox: word === 'BOX',
      isFish: word === 'FISH', isFrog: word === 'FROG', isHouse: word === 'HOUSE',
      isRocket: word === 'ROCKET', isRainbow: word === 'RAINBOW', isUmbrella: word === 'UMBRELLA',
      dots: S.words.map(function (w, i) { return { fill: i < round || (i === round && s.roundDone) ? '#ffc21a' : i === round ? '#7cc0ff' : '#1a1246' }; }),
      speak: function () { self.say(word.toLowerCase()); },
      slotRow: 'gap: ' + z.sGap + 'px;',
      slots: word.split('').map(function (ch, i) {
        var done = i < s.filled;
        var box = 'width: ' + z.sw + 'px; height: ' + z.sh + 'px; border-radius: ' + z.sRad + 'px; font-size: ' + z.sFont + 'px; ';
        return {
          ch: done ? ch : '',
          style: box + (done
            ? self.face(self.colorOf(ch)) + ' color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.3);'
            : 'border: ' + z.sBorder + 'px dashed ' + (i === s.filled ? '#ffc21a' : '#5444b8') + '; background: rgba(0,0,0,0.15);')
        };
      }),
      help: s.wrong !== null ? 'Not that one. Listen again: ' + word.toLowerCase() + '!' : s.filled === 0 ? 'Tap the letters to build the word.' : 'Great! What comes next?',
      trayBox: 'width: ' + z.rowW + 'px; column-gap: ' + z.gap + 'px; row-gap: ' + z.rowGap + 'px;',
      tray: trayLetters.map(function (ch, i) {
        var used = !!s.used[i];
        var p = self.pal()[self.colorOf(ch)];
        var stud = 'top: -' + (z.studH - 2) + 'px; width: ' + z.studW + 'px; height: ' + z.studH + 'px; background: ' + p[1] + ';';
        var box = 'width: ' + z.tw + 'px; height: ' + z.th + 'px; border-radius: ' + z.tRad + 'px; font-size: ' + z.tFont + 'px; ';
        return {
          ch: ch,
          studL: stud + ' left: ' + z.studIn + 'px;',
          studR: stud + ' right: ' + z.studIn + 'px;',
          style: box + self.face(self.colorOf(ch)) + (used ? ' opacity: 0.2; transform: scale(0.85);' : s.wrong === i ? ' transform: translateX(-8px) rotate(-6deg);' : ' transform: rotate(' + (i % 2 ? 3 : -3) + 'deg);'),
          tap: function () {
            if (used || s.roundDone) return;
            if (ch === word.charAt(s.filled)) {
              self.say(ch);
              var u = Object.assign({}, s.used);
              u[i] = true;
              var filled = s.filled + 1;
              var done = filled === word.length;
              self.setState({ stage: stage, round: round, filled: filled, used: u, wrong: null, slips: s.slips, roundDone: done });
              if (done) setTimeout(function () { self.say(word.toLowerCase()); }, 700);
            } else {
              self.setState({ stage: stage, round: round, filled: s.filled, used: s.used, wrong: i, slips: s.slips + 1, roundDone: false });
              setTimeout(function () { self.setState({ wrong: null }); }, 400);
            }
          }
        };
      }),
      roundDone: s.roundDone,
      doneTitle: round === last ? 'You built ' + S.words.length + ' words!' : 'You built ' + word + '!',
      doneText: round === last ? (s.slips <= 1 ? '3 stars and a new sticker for your book.' : 'Great building! You found a new sticker.') : word.split('').join('-') + '... ' + word.toLowerCase() + '. Ready for the next one?',
      nextLabel: round === last ? 'Play again' : 'Next word',
      next: function () {
        if (round === last) self.setState(self.fresh(stage));
        else self.setState({ stage: stage, round: round + 1, filled: 0, used: {}, wrong: null, slips: s.slips, roundDone: false });
      }
    };
  }
}
</script>
</body>
</html>
