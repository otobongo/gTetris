<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grown-ups corner, tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<dc-import name="Grownups" device="tablet" gate="{{gate}}" pin="{{pin}}" hint-size="834px,1194px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"gate":{"editor":"enum","options":["hold","open","pin","pinLocked","forgot","clearHold"],"default":"hold"},"pin":{"editor":"enum","options":["off","form","on","cleared","noCrypto"],"default":"off"},"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() { return { gate: this.props.gate ?? 'hold', pin: this.props.pin ?? 'off' }; }
}
</script>
</body>
</html>
