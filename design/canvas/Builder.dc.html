<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picture Builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{W}}px; height: {{H}}px; overflow: hidden; background: radial-gradient(120% 80% at 50% 15%, #33278a, #1a1246); font-family: 'Baloo 2', system-ui, sans-serif; color: #ffffff;">
<div style="zoom: {{Z}}; width: {{IW}}px; height: {{IH}}px; box-sizing: border-box; padding: 20px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative;">

<div style="width: 100%; display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 10px;">
<a href="{{hubHref}}" aria-label="Back to home" style="width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="text-align: center; line-height: 1.1;">
<div style="font-size: 24px; font-weight: 800;">Picture Builder</div>
<div style="font-size: 15px; font-weight: 700; color: #c9c2ff;">Look, then build it</div>
</div>
<button onClick="{{clearAll}}" aria-label="Clear my board" style="border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v5h5"></path></svg>
</button>
</div>

<div style="display: flex; gap: 6px; padding: 5px; border-radius: 16px; background: #30257a;">
<button onClick="{{modeLook}}" aria-pressed="{{isLook}}" style="border: 0; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 800; padding: 8px 14px; border-radius: 12px; {{lookStyle}}">Copy it</button>
<button onClick="{{modeMemory}}" aria-pressed="{{isMemory}}" style="border: 0; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 800; padding: 8px 14px; border-radius: 12px; {{memStyle}}">From memory</button>
</div>

<div style="width: 100%; display: flex; align-items: center; gap: 14px;">
<div style="flex-shrink: 0; padding: 8px; border-radius: 18px; background: #30257a; position: relative;">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; width: 108px;">
<sc-for list="{{model}}" as="m" hint-placeholder-count="16">
<span style="height: 25px; border-radius: 5px; {{m.style}}"></span>
</sc-for>
</div>
<sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
<button onClick="{{peek}}" aria-label="Peek at the picture" style="position: absolute; inset: 0; border: 0; cursor: pointer; border-radius: 18px; font-family: inherit; color: #ffffff; font-size: 15px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: linear-gradient(180deg, #5444b8, #3a2d8f);">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
Peek
</button>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0;">
<span style="font-size: 20px; font-weight: 800; line-height: 1.15;">{{title}}</span>
<span style="font-size: 15px; font-weight: 700; color: #c9c2ff; line-height: 1.25;">{{help}}</span>
<div style="height: 10px; border-radius: 999px; background: #1a1246; overflow: hidden;">
<div style="height: 100%; border-radius: 999px; transition: width 0.3s; width: {{pct}}%; background: #5fe06e;"></div>
</div>
<span style="font-size: 14px; font-weight: 800; color: #5fe06e;">{{matchText}}</span>
</div>
</div>

<div onPointerDown="{{paintDown}}" onPointerMove="{{paintMove}}" onPointerUp="{{paintUp}}" onPointerCancel="{{paintUp}}" style="padding: 10px; border-radius: 24px; background: #1d1550; box-shadow: inset 0 4px 10px rgba(0,0,0,0.45), 0 0 0 4px #3a2d8f; touch-action: none;">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 284px;">
<sc-for list="{{board}}" as="b" hint-placeholder-count="16">
<button data-cell="{{b.i}}" aria-label="{{b.label}}" style="border: 0; padding: 0; cursor: pointer; height: 66px; border-radius: 12px; transition: background 0.12s, transform 0.12s; {{b.style}}"></button>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;">
<sc-for list="{{palette}}" as="p" hint-placeholder-count="7">
<button onClick="{{p.pick}}" aria-label="{{p.label}}" aria-pressed="{{p.on}}" style="border: 0; cursor: pointer; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; transition: transform 0.12s; {{p.style}}">
<sc-if value="{{p.eraser}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9c2ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21h10"></path><path d="M5 15l8-8 6 6-6 6H9z"></path></svg>
</sc-if>
</button>
</sc-for>
</div>

<sc-if value="{{won}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(10,6,30,0.6); display: grid; place-items: center; padding: 16px;">
<div style="width: 100%; max-width: 330px; box-sizing: border-box; text-align: center; padding: 24px 20px 20px; border-radius: 26px; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 8px 0 #241a63;">
<div style="font-size: 32px; font-weight: 800; line-height: 1.1;">You built a {{name}}!</div>
<div style="font-size: 17px; font-weight: 700; color: #c9c2ff; margin: 8px 0 14px;">{{winText}}</div>
<button onClick="{{next}}" style="border: 0; cursor: pointer; font-family: inherit; color: #063510; font-size: 20px; font-weight: 800; padding: 12px 28px; border-radius: 16px; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26;">Next picture</button>
</div>
</div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pic: 0, cells: this.empty(), color: 'red', mode: 'look', peeking: false, peeks: 0, won: false };
    this.painting = false;
  }
  empty() { var a = []; for (var i = 0; i < 16; i++) a.push(null); return a; }
  pictures() {
    var R = 'red', Y = 'yellow', B = 'blue', G = 'green', O = 'orange', W = 'white', _ = null;
    return [
      { name: 'house', cells: [_, R, R, _, R, R, R, R, Y, Y, B, Y, Y, Y, B, Y] },
      { name: 'tree', cells: [_, G, G, _, G, G, G, G, _, O, O, _, _, O, O, _] },
      { name: 'boat', cells: [_, R, _, _, _, W, W, _, O, O, O, O, B, B, B, B] }
    ];
  }
  pal() {
    return {
      red: ['#f03a3a', '#ff7a6e', '#b51f27'], yellow: ['#ffc21a', '#ffe266', '#d48a00'], green: ['#1fb53c', '#5fe06e', '#0f7a26'],
      blue: ['#2f8cff', '#7cc0ff', '#1557c4'], orange: ['#ff7a1a', '#ffab5e', '#c4500a'], white: ['#f1eef7', '#ffffff', '#b9b3c9']
    };
  }
  brick(color, stud) {
    var p = this.pal()[color];
    var studs = 'radial-gradient(circle at 46% 42%, ' + p[1] + ' 0 19%, transparent 21%), radial-gradient(circle at 50% 50%, ' + p[0] + ' 0 25%, transparent 27%), radial-gradient(circle at 54% 58%, rgba(0,0,0,0.28) 0 26%, transparent 28%), ';
    var base = 'linear-gradient(160deg, ' + p[1] + ' -30%, ' + p[0] + ' 45%, ' + p[2] + ' 140%)';
    return 'background: ' + (stud ? studs : '') + base + '; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -4px 0 rgba(0,0,0,0.22);';
  }
  paintAt(x, y) {
    var hit = document.elementFromPoint(x, y);
    var cell = hit && hit.closest ? hit.closest('[data-cell]') : null;
    if (!cell) return;
    var i = Number(cell.getAttribute('data-cell'));
    var s = this.state;
    var c = s.color === 'eraser' ? null : s.color;
    if (s.cells[i] === c) return;
    var cells = s.cells.slice();
    cells[i] = c;
    var target = this.pictures()[s.pic].cells;
    var won = cells.every(function (v, k) { return v === target[k]; });
    this.setState({ cells: cells, won: won });
  }
  componentWillUnmount() { clearTimeout(this.peekT); }
  renderVals() {
    var self = this;
    var s = this.state;
    var tablet = this.props.device === 'tablet';
    var pic = this.pictures()[s.pic];
    var matches = s.cells.filter(function (v, k) { return v === pic.cells[k]; }).length;
    var hidden = s.mode === 'memory' && !s.peeking;
    var wrongCount = s.cells.filter(function (v, k) { return v !== null && v !== pic.cells[k]; }).length;
    return {
      W: tablet ? 834 : 390, H: tablet ? 1194 : 844, Z: tablet ? 1.4 : 1, IW: tablet ? 596 : 390, IH: tablet ? 853 : 844,
      hubHref: tablet ? 'HubTablet.dc.html' : 'Hub.dc.html',
      isLook: s.mode === 'look', isMemory: s.mode === 'memory',
      lookStyle: s.mode === 'look' ? 'background: #ffc21a; color: #5a3500;' : 'background: transparent; color: #c9c2ff;',
      memStyle: s.mode === 'memory' ? 'background: #ffc21a; color: #5a3500;' : 'background: transparent; color: #c9c2ff;',
      modeLook: function () { self.setState({ mode: 'look', peeking: false }); },
      modeMemory: function () {
        self.setState({ mode: 'memory', peeking: true, cells: self.empty(), peeks: 0 });
        clearTimeout(self.peekT);
        self.peekT = setTimeout(function () { self.setState({ peeking: false }); }, 4000);
      },
      hidden: hidden,
      peek: function () {
        self.setState({ peeking: true, peeks: s.peeks + 1 });
        clearTimeout(self.peekT);
        self.peekT = setTimeout(function () { self.setState({ peeking: false }); }, 2000);
      },
      model: pic.cells.map(function (c) { return { style: c ? self.brick(c, false) : 'background: rgba(255,255,255,0.06);' }; }),
      title: s.mode === 'memory' ? (s.peeking ? 'Look closely...' : 'Build it from memory!') : 'Build the ' + pic.name,
      help: s.mode === 'memory'
        ? (s.peeking ? 'Remember the colors and where they go.' : 'Tap Peek if you need another look.')
        : wrongCount ? 'One brick is not quite right. Look again!' : 'Pick a color, then tap or drag over the squares.',
      pct: Math.round((matches / 16) * 100),
      matchText: matches + ' of 16 squares match',
      board: s.cells.map(function (c, i) {
        return {
          i: String(i),
          label: 'Square ' + (i + 1) + (c ? ', ' + c : ', empty'),
          style: c ? self.brick(c, true) : 'background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);'
        };
      }),
      paintDown: function (e) {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        self.painting = true;
        self.paintAt(e.clientX, e.clientY);
      },
      paintMove: function (e) { if (self.painting) self.paintAt(e.clientX, e.clientY); },
      paintUp: function () { self.painting = false; },
      palette: ['red', 'yellow', 'green', 'blue', 'orange', 'white', 'eraser'].map(function (c) {
        var on = s.color === c;
        return {
          label: c === 'eraser' ? 'Eraser' : c,
          on: on, eraser: c === 'eraser',
          style: (c === 'eraser' ? 'background: #30257a;' : self.brick(c, false)) + (on ? ' outline: 4px solid #ffffff; outline-offset: 2px; transform: translateY(-3px);' : ''),
          pick: function () { self.setState({ color: c }); }
        };
      }),
      clearAll: function () { self.setState({ cells: self.empty(), won: false }); },
      won: s.won,
      name: pic.name,
      winText: s.mode === 'memory' ? (s.peeks === 0 ? 'From memory with no peeks. Amazing!' : 'From memory with ' + s.peeks + ' peek' + (s.peeks === 1 ? '' : 's') + '. Great remembering!') : 'Every brick in the right spot. Try it from memory next!',
      next: function () { self.setState({ pic: (s.pic + 1) % 3, cells: self.empty(), won: false }); if (s.mode === 'memory') { self.setState({ peeking: true, peeks: 0 }); clearTimeout(self.peekT); self.peekT = setTimeout(function () { self.setState({ peeking: false }); }, 4000); } }
    };
  }
}
</script>
</body>
</html>
