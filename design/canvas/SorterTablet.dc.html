<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape Sorter, tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<dc-import name="Sorter" device="tablet" level="{{level}}" puzzle="{{puzzle}}" moment="{{moment}}" hint-size="834px,1194px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"level":{"editor":"enum","options":["1","3","5","7","9"],"default":"3"},"puzzle":{"editor":"enum","options":["1","2","3","4"],"default":"3"},"moment":{"editor":"enum","options":["play","picked","wrong","solved","stuck","levelDone","gameDone"],"default":"play"},"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() { return { level: this.props.level ?? '3', puzzle: this.props.puzzle ?? '3', moment: this.props.moment ?? 'play' }; }
}
</script>
</body>
</html>
