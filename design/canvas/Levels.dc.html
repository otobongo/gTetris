<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button:focus-visible, a:focus-visible { outline: 3px solid #ffc21a; outline-offset: 2px; } .bw-press { transition: transform 0.1s cubic-bezier(0.16,1,0.3,1), box-shadow 0.1s cubic-bezier(0.16,1,0.3,1); } .bw-press:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sh) !important; }</style>
</helmet>
<div style="width: {{W}}px; height: {{H}}px; overflow: hidden; background: radial-gradient(120% 80% at 50% 15%, #33278a, #1a1246); font-family: 'Baloo 2', system-ui, sans-serif; color: #ffffff;">
<div style="zoom: {{Z}}; width: {{IW}}px; height: {{IH}}px; box-sizing: border-box; padding: 20px 16px 18px; display: flex; flex-direction: column; gap: 12px; position: relative;">

<div style="width: 100%; display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 10px; flex-shrink: 0;">
<a href="{{homeHref}}" aria-label="Back to home" class="bw-press" style="--sh: #241a63; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="text-align: center; line-height: 1.1; min-width: 0;">
<h1 style="margin: 0; font-size: 24px; font-weight: 800; line-height: 1.1;">{{title}}</h1>
<div style="font-size: 15px; font-weight: 700; color: #c9c2ff; font-variant-numeric: tabular-nums;">{{sub}}</div>
</div>
<sc-if value="{{speakOn}}" hint-placeholder-val="{{ true }}">
<button onClick="{{speak}}" aria-label="Read this page aloud" class="bw-press" style="--sh: #241a63; border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9.5a3.5 3.5 0 0 1 0 5"></path><path d="M19 7a7 7 0 0 1 0 10"></path></svg>
</button>
</sc-if>
<sc-if value="{{speakOff}}" hint-placeholder-val="{{ false }}">
<span></span>
</sc-if>
</div>

<div data-levels-scroll="true" style="flex: 1 1 0; min-height: 0; overflow-y: auto; margin: 0 -16px; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 24px; position: relative;">
<sc-for list="{{chapters}}" as="c" hint-placeholder-count="3">
<section style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; row-gap: 0;">
<h2 style="margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15;">{{c.title}}</h2>
<span style="font-size: 14px; font-weight: 700; color: #c9c2ff;">{{c.note}}</span>
</div>
<div style="display: grid; grid-template-columns: {{gridCols}}; gap: 8px;">
<sc-for list="{{c.tiles}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.play}}" hint-placeholder-val="{{ true }}">
<a href="{{t.href}}" aria-label="{{t.label}}" aria-current="{{t.ariaCur}}" class="bw-press" style="aspect-ratio: 1 / 1; box-sizing: border-box; border-radius: 16px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; {{t.style}}">
<span aria-hidden="true" style="font-size: 22px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">{{t.n}}</span>
<sc-if value="{{t.cur}}" hint-placeholder-val="{{ false }}">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: 2px;"><path d="M8 5l11 7-11 7z" fill="currentColor"></path></svg>
</sc-if>
<sc-if value="{{t.showStars}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="display: flex; gap: 1px;">
<sc-for list="{{t.stars}}" as="s" hint-placeholder-count="3">
<svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z" fill="{{s.fill}}"></path></svg>
</sc-for>
</span>
</sc-if>
</a>
</sc-if>
<sc-if value="{{t.locked}}" hint-placeholder-val="{{ false }}">
<button onClick="{{t.tap}}" aria-disabled="true" aria-label="{{t.label}}" style="aspect-ratio: 1 / 1; box-sizing: border-box; border: 0; padding: 0; cursor: default; font-family: inherit; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #1d1550; color: #c9c2ff;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e85d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span aria-hidden="true" style="font-size: 14px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">{{t.n}}</span>
</button>
</sc-if>
</sc-for>
<sc-if value="{{c.more}}" hint-placeholder-val="{{ false }}">
<div style="aspect-ratio: 1 / 1; box-sizing: border-box; border-radius: 16px; border: 2px dashed #6d5fd0; display: grid; place-items: center; padding: 4px; text-align: center; font-size: 14px; font-weight: 800; line-height: 1.1; color: #c9c2ff;">More soon</div>
</sc-if>
</div>
</section>
</sc-for>
</div>

<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
<p role="status" style="margin: 0; min-height: 20px; text-align: center; font-size: 15px; font-weight: 700; line-height: 1.35; color: #c9c2ff;">{{status}}</p>
<sc-if value="{{showPlay}}" hint-placeholder-val="{{ true }}">
<a href="{{playHref}}" class="bw-press" style="--sh: #0f7a26; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #063510; font-size: 24px; font-weight: 800; padding: 16px; border-radius: 20px; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 6px 0 #0f7a26;">
{{playLabel}}
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"></path></svg>
</a>
</sc-if>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"game":{"editor":"enum","options":["escape","drop","letters","mixer","sorter","pattern","numbers","builder","math"],"default":"escape"},"kid":{"editor":"enum","options":["leo4","nia6","maya7","theo10"],"default":"maya7"},"progress":{"editor":"enum","options":["new","midway","complete"],"default":"midway"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: '' };
  }
  componentDidMount() {
    // On load, scroll each level list so the chapter holding the current level is in view.
    setTimeout(function () {
      try {
        var lists = document.querySelectorAll('[data-levels-scroll]');
        for (var i = 0; i < lists.length; i++) {
          var sc = lists[i];
          var cur = sc.querySelector('[aria-current="step"]');
          if (!cur) continue;
          var sec = cur.closest('section');
          if (!sec) continue;
          if (cur.offsetTop + cur.offsetHeight > sc.scrollTop + sc.clientHeight) sc.scrollTop = Math.max(0, sec.offsetTop - 4);
        }
      } catch (e) {}
    }, 0);
  }
  // Sample children (name, age, colour), matching Who's playing and Letter Builder.
  kids() {
    return {
      leo4: { name: 'Leo', age: 4, color: 'orange' },
      nia6: { name: 'Nia', age: 6, color: 'teal' },
      maya7: { name: 'Maya', age: 7, color: 'blue' },
      theo10: { name: 'Theo', age: 10, color: 'purple' }
    };
  }
  // Chapters per game. Escape, Drop and Letters come from src (slide/levels.ts, drop/StageSelect.tsx,
  // letters/levels.ts). The other six come from what each canvas board already shows; their level
  // counts and chapter splits are sample data until the games are built.
  games() {
    return {
      escape: { title: 'Brick Escape', board: 'Escape', noun: 'Level', chapters: [
        { title: 'Getting started', note: 'one idea at a time', count: 8 },
        { title: 'Think first', note: 'some bricks block others', count: 5 },
        { title: 'Icy doors', note: 'wait for the ice to melt', count: 6 },
        // Formerly "Frozen bricks", a mechanic removed in commit 4177268.
        { title: 'Stone blocks', note: '', count: 6 },
        { title: 'Big bricks', note: 'tight squeeze', count: 5 },
        // Open-ended in src: no master levels exist yet, so the chapter shows only the "More soon" tile.
        { title: 'Master', note: 'for real brick experts', count: 0, more: true }
      ] },
      drop: { title: 'Brick Drop', board: 'Drop', noun: 'Stage', chapters: [
        { title: 'Small bricks', note: '1 to 3 squares', count: 4 },
        { title: 'Four-square bricks', note: 'bigger board', count: 5 },
        { title: 'Big bricks', note: 'up to 5 squares', count: 3 }
      ] },
      letters: { title: 'Letter Builder', board: 'Letters', noun: 'Level', chapters: [
        { title: 'Alphabet Train', note: 'tap the letters in order', count: 7 },
        { title: 'Big and small', note: 'match A with a', count: 4 },
        { title: 'First sounds', note: 'what does it start with?', count: 4 },
        { title: 'Spell it', note: 'build the word', count: 9 }
      ] },
      mixer: { title: 'Color Mixer', board: 'Mixer', noun: 'Level', chapters: [
        { title: 'Mix two colors', note: 'red, yellow and blue', count: 3 },
        { title: 'Add white', note: 'make a color lighter', count: 3 }
      ] },
      sorter: { title: 'Shape Sorter', board: 'Sorter', noun: 'Level', chapters: [
        { title: 'Shapes', note: 'match each shape to its hole', count: 3 },
        { title: 'Shape and color', note: 'the color matters too', count: 2 }
      ] },
      pattern: { title: 'Pattern Train', board: 'Pattern', noun: 'Level', chapters: [
        { title: 'AB patterns', note: 'two things take turns', count: 2 },
        { title: 'ABC patterns', note: 'three things take turns', count: 1 },
        { title: 'Same shape, new color', note: 'watch the colors', count: 1 }
      ] },
      numbers: { title: 'Number Line-up', board: 'Numbers', noun: 'Level', chapters: [
        { title: 'In order', note: 'small to big', count: 5 },
        { title: 'Missing numbers', note: 'fill the gap', count: 5 },
        { title: 'Count by 5s and 10s', note: 'bigger jumps', count: 5 }
      ] },
      builder: { title: 'Picture Builder', board: 'Builder', noun: 'Level', chapters: [
        { title: 'Look and build', note: 'copy the picture', count: 3 },
        { title: 'From memory', note: 'look, then build', count: 3 }
      ] },
      math: { title: 'Brick Calculator', board: 'Math', noun: 'Level', chapters: [
        { title: 'Add', note: 'put bricks together', count: 5 },
        { title: 'Take away', note: 'take bricks off', count: 5 }
      ] }
    };
  }
  // Sample data. "midway" matches Home for Maya: Escape Level 9 (8 done, 17 stars), Drop Stage 4
  // (3 done, 6 stars), Letters Level 17 (16 done, 19 stars); 17 + 6 + 19 = Home's 42.
  // The other six follow Home's pills. Leo's Letter Builder follows the Letters board (Level 3).
  midway(game, kid) {
    var byKid = { leo4: { letters: { cur: 3, stars: 5 } } };
    if (byKid[kid] && byKid[kid][game]) return byKid[kid][game];
    return {
      escape: { cur: 9, stars: 17 }, drop: { cur: 4, stars: 6 }, letters: { cur: 17, stars: 19 },
      mixer: { cur: 4, stars: 7 }, sorter: { cur: 2, stars: 3 }, pattern: { cur: 1, stars: 0 },
      numbers: { cur: 3, stars: 5 }, builder: { cur: 1, stars: 0 }, math: { cur: 1, stars: 0 }
    }[game];
  }
  // Spread a star total over the finished levels: at least 1 each (that is what opens the next), at most 3.
  spread(done, total) {
    var a = [];
    for (var i = 0; i < done; i++) a.push(1);
    // A fixed, uneven order so the stars look like real play, not a stripe.
    var order = a.map(function (x, i) { return i; }).sort(function (x, y) { return ((x * 7) % 5) - ((y * 7) % 5) || x - y; });
    var left = Math.min(total, done * 3) - done;
    for (var k = 0; k < done && left > 0; k++) {
      var add = Math.min(2, left);
      a[order[k]] += add;
      left -= add;
    }
    return a;
  }
  say(text) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  renderVals() {
    var self = this;
    var p = this.props || {};
    var tablet = p.device === 'tablet';
    var t = tablet ? 'Tablet' : '';
    var all = this.games();
    var gameKey = all[p.game] ? p.game : 'escape';
    var G = all[gameKey];
    var kids = this.kids();
    var kidKey = kids[p.kid] ? p.kid : 'maya7';
    var kid = kids[kidKey];
    var progress = p.progress === 'new' || p.progress === 'complete' ? p.progress : 'midway';
    var small = kid.age <= 4;
    var reads = kid.age <= 6;
    var early = kid.age >= 9;
    var noun = G.noun;
    var href = G.board + t + '.dc.html';

    var total = 0;
    G.chapters.forEach(function (c) { total += c.count; });
    var cur = 1, starsByLevel = {};
    if (progress === 'complete') {
      cur = 0;
      for (var n = 1; n <= total; n++) starsByLevel[n] = n % 5 === 0 ? 2 : 3;
    } else if (progress === 'midway') {
      var m = this.midway(gameKey, kidKey);
      cur = m.cur;
      var sp = this.spread(cur - 1, m.stars);
      for (var d = 0; d < sp.length; d++) starsByLevel[d + 1] = sp[d];
    }
    var starSum = 0;
    Object.keys(starsByLevel).forEach(function (k) { starSum += starsByLevel[k]; });

    // Unlock rule: linear. Ages 9 to 10 also get the first level of every chapter open.
    var firsts = {}, at = 1;
    G.chapters.forEach(function (c) { if (c.count) firsts[at] = true; at += c.count; });
    var stateOf = function (n) {
      if (starsByLevel[n]) return 'done';
      if (n === cur) return 'current';
      if (early && firsts[n]) return 'open';
      return 'locked';
    };
    var lockMsg = function (n) {
      var q = n - 1;
      while (q > 1 && stateOf(q) === 'locked') q--;
      if (q === n - 1) return 'Finish ' + noun + ' ' + q + ' to open ' + noun + ' ' + n + '.';
      return 'Finish ' + noun + ' ' + q + ' first. ' + noun + 's open one at a time.';
    };

    var raised = 'background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 4px 0 #241a63; --sh: #241a63; color: #ffffff;';
    var yellow = 'background: linear-gradient(180deg, #ffe266, #ffc21a); box-shadow: 0 4px 0 #d48a00; --sh: #d48a00; color: #5a3500;';
    var starRow = function (k) {
      return [1, 2, 3].map(function (i) { return { fill: i <= k ? '#ffb21f' : 'rgba(0,0,0,0.3)' }; });
    };

    var first = 1;
    var chapters = G.chapters.map(function (c) {
      var tiles = [];
      for (var n = first; n < first + c.count; n++) {
        var st = stateOf(n);
        var k = starsByLevel[n] || 0;
        var label = st === 'done' ? noun + ' ' + n + ', ' + k + ' star' + (k === 1 ? '' : 's')
          : st === 'current' ? noun + ' ' + n + ', play next'
          : st === 'open' ? noun + ' ' + n + ', not played'
          : noun + ' ' + n + ', locked';
        tiles.push({
          n: n, label: label, href: href,
          play: st !== 'locked', locked: st === 'locked', cur: st === 'current',
          showStars: st === 'done' || st === 'open',
          ariaCur: st === 'current' ? 'step' : 'false',
          style: st === 'current' ? yellow : raised,
          stars: starRow(k),
          tap: (function (msg) {
            return function () { self.setState({ status: msg }); if (reads) self.say(msg); };
          })(st === 'locked' ? lockMsg(n) : '')
        });
      }
      first += c.count;
      return { title: c.title, note: c.note, tiles: tiles, more: !!c.more };
    });

    var showPlay = progress !== 'complete';
    var playLabel = 'Play ' + noun + ' ' + cur;
    var doneMsg = 'You finished every ' + noun.toLowerCase() + '! Pick one to play again.';
    var status = this.state.status || (progress === 'complete' ? doneMsg : '');
    var cols = tablet ? (small ? 6 : 8) : (small ? 4 : 5);

    return {
      W: tablet ? 834 : 390, H: tablet ? 1194 : 844, Z: tablet ? 1.4 : 1, IW: tablet ? 596 : 390, IH: tablet ? 853 : 844,
      homeHref: 'Hub' + t + '.dc.html',
      title: G.title,
      sub: starSum > 0 ? starSum + ' of ' + total * 3 + ' stars' : 'No stars yet',
      speakOn: reads, speakOff: !reads,
      speak: function () { self.say(G.title + '. ' + (showPlay ? playLabel : doneMsg)); },
      gridCols: 'repeat(' + cols + ', minmax(0, 1fr))',
      chapters: chapters,
      status: status,
      showPlay: showPlay,
      playHref: href,
      playLabel: playLabel
    };
  }
}
</script>
</body>
</html>
