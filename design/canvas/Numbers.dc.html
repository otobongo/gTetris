<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Number Line-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{W}}px; height: {{H}}px; overflow: hidden; background: radial-gradient(120% 80% at 50% 15%, #33278a, #1a1246); font-family: 'Baloo 2', system-ui, sans-serif; color: #ffffff;">
<div style="zoom: {{Z}}; width: {{IW}}px; height: {{IH}}px; box-sizing: border-box; padding: 20px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;">

<div style="width: 100%; display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 10px;">
<a href="{{hubHref}}" aria-label="Back to home" style="width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="text-align: center; line-height: 1.1;">
<div style="font-size: 24px; font-weight: 800;">Number Line-up</div>
<div style="font-size: 15px; font-weight: 700; color: #c9c2ff;">Explore · Level 3 of 15</div>
</div>
<button onClick="{{shuffle}}" aria-label="Mix them up" style="border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3c5 0 5 10 10 10h3"></path><path d="M4 17h3c2 0 3-1.5 4-3.5"></path><path d="M13 9.5c1-2 2-2.5 4-2.5h3"></path><path d="M18 4l3 3-3 3M18 14l3 3-3 3"></path></svg>
</button>
</div>

<div style="display: flex; gap: 6px; padding: 5px; border-radius: 16px; background: #30257a;">
<button onClick="{{modeUp}}" aria-pressed="{{isUp}}" style="border: 0; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 800; padding: 8px 14px; border-radius: 12px; {{upStyle}}">Smallest first</button>
<button onClick="{{modeDown}}" aria-pressed="{{isDown}}" style="border: 0; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 800; padding: 8px 14px; border-radius: 12px; {{downStyle}}">Biggest first</button>
</div>

<div style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 18px; background: #30257a;">
<span style="font-size: 14px; font-weight: 800; color: #c9c2ff;">GOAL</span>
<div style="display: flex; align-items: flex-end; gap: 3px; height: 34px;" aria-hidden="true">
<sc-for list="{{goalBars}}" as="g" hint-placeholder-count="6">
<span style="width: 14px; border-radius: 3px; background: {{g.color}}; height: {{g.h}}px;"></span>
</sc-for>
</div>
<span style="font-size: 15px; font-weight: 800; line-height: 1.2; flex-grow: 1;">{{goalText}}</span>
</div>

<p style="margin: 0; min-height: 50px; font-size: 18px; font-weight: 800; line-height: 1.3; text-align: center; color: {{promptColor}};">{{prompt}}</p>

<div style="width: 100%; box-sizing: border-box; padding: 16px 8px 12px; border-radius: 28px; background: #1d1550; box-shadow: inset 0 4px 10px rgba(0,0,0,0.45); flex-grow: 1; display: flex; flex-direction: column;">
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end;">
<sc-for list="{{towers}}" as="t" hint-placeholder-count="6">
<button data-slot="{{t.slot}}" onClick="{{t.tap}}" onPointerDown="{{t.down}}" onPointerMove="{{t.move}}" onPointerUp="{{t.up}}" onPointerCancel="{{t.cancel}}" aria-label="{{t.label}}" style="position: relative; border: 0; padding: 0; background: transparent; cursor: grab; touch-action: none; display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; height: 100%; justify-content: flex-start; {{t.wrap}}">
<span style="width: 48px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; font-weight: 800; color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); flex-shrink: 0; {{t.face}} {{t.ring}}">{{t.n}}</span>
<sc-for list="{{t.studs}}" as="b" hint-placeholder-count="3">
<span style="width: 40px; height: 22px; border-radius: 6px; flex-shrink: 0; {{b.style}}"></span>
</sc-for>
<sc-if value="{{t.hand}}" hint-placeholder-val="{{ false }}">
<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; margin-bottom: 2px;"><path d="M12 21l-6-8h4V3h4v10h4z" fill="#ffe266" stroke="#d48a00" stroke-width="1.5" stroke-linejoin="round"></path></svg>
</sc-if>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 8px;">
<sc-for list="{{marks}}" as="m" hint-placeholder-count="6">
<span style="height: 8px; border-radius: 999px; background: {{m.fill}};"></span>
</sc-for>
</div>
<div style="margin-top: 6px; text-align: center; font-size: 13px; font-weight: 700; color: #c9c2ff;">A green line means that tower is in the right spot.</div>
</div>

<div style="width: 100%; display: flex; align-items: center; gap: 12px;">
<button onClick="{{showMe}}" disabled="{{demo}}" style="border: 0; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; color: #ffffff; font-size: 18px; font-weight: 800; padding: 12px 18px; border-radius: 18px; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26; white-space: nowrap; opacity: {{showOpacity}};">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"></path></svg>
Show me how
</button>
<span style="font-size: 14px; font-weight: 700; color: #c9c2ff; line-height: 1.25;">Later levels: missing numbers (2, 4, _, 8) and counting by 5s and 10s.</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { order: [4, 1, 6, 3, 5, 2], dir: 'up', picked: null, drag: null, swapFlash: null, demo: false, demoMsg: '', hl: null };
    this.justDragged = false;
  }
  pal() {
    return {
      1: ['#1fb53c', '#5fe06e', '#0f7a26'], 2: ['#ffc21a', '#ffe266', '#d48a00'], 3: ['#f03a3a', '#ff7a6e', '#b51f27'],
      4: ['#2f8cff', '#7cc0ff', '#1557c4'], 5: ['#9b4dff', '#c79bff', '#6624c9'], 6: ['#ff7a1a', '#ffab5e', '#c4500a']
    };
  }
  face(n, stud) {
    var p = this.pal()[n];
    var studs = stud ? 'radial-gradient(circle at 46% 42%, ' + p[1] + ' 0 19%, transparent 21%), radial-gradient(circle at 50% 50%, ' + p[0] + ' 0 25%, transparent 27%), radial-gradient(circle at 54% 58%, rgba(0,0,0,0.28) 0 26%, transparent 28%), ' : '';
    var size = stud ? '20px 22px, 20px 22px, 20px 22px, 100% 100%' : '100% 100%';
    return 'background: ' + studs + 'linear-gradient(160deg, ' + p[1] + ' -30%, ' + p[0] + ' 45%, ' + p[2] + ' 140%); background-size: ' + size + '; background-position: 0 0; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -3px 0 rgba(0,0,0,0.22);';
  }
  sorted(order, dir) {
    for (var i = 1; i < order.length; i++) if (dir === 'up' ? order[i] < order[i - 1] : order[i] > order[i - 1]) return false;
    return true;
  }
  swap(i, j) {
    if (i === j) return;
    var o = this.state.order.slice();
    var t = o[i]; o[i] = o[j]; o[j] = t;
    this.setState({ order: o, picked: null, drag: null, swapFlash: [i, j] });
    var self = this;
    setTimeout(function () { self.setState({ swapFlash: null }); }, 400);
    if (this.sorted(o, this.state.dir)) {
      try { var u = new SpeechSynthesisUtterance(o.join(', ')); u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
    }
  }
  componentWillUnmount() { (this.demoT || []).forEach(clearTimeout); }
  /** Plays the puzzle by itself: find the tower that belongs in each spot and swap it there. */
  showMe() {
    var self = this;
    var dir = this.state.dir;
    var o = this.state.order.slice();
    var steps = [];
    for (var i = 0; i < o.length; i++) {
      var best = i;
      for (var j = i + 1; j < o.length; j++) if (dir === 'up' ? o[j] < o[best] : o[j] > o[best]) best = j;
      if (best !== i) { steps.push([i, best, o[best]]); var t = o[i]; o[i] = o[best]; o[best] = t; }
    }
    var at = 0;
    var T = [];
    var spot = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth'];
    self.setState({ demo: true, picked: null, hl: null, demoMsg: dir === 'up' ? 'Watch: I look for the smallest tower first.' : 'Watch: I look for the biggest tower first.' });
    at += 1600;
    steps.forEach(function (st) {
      T.push(setTimeout(function () { self.setState({ hl: [st[1]], demoMsg: st[2] + ' belongs in the ' + spot[st[0]] + ' spot.' }); }, at));
      at += 1300;
      T.push(setTimeout(function () { self.setState({ hl: [st[1], st[0]], demoMsg: 'Drag ' + st[2] + ' onto the ' + spot[st[0]] + ' tower to swap them.' }); }, at));
      at += 1100;
      T.push(setTimeout(function () { self.swap(st[0], st[1]); self.setState({ hl: [st[0]] }); }, at));
      at += 900;
    });
    T.push(setTimeout(function () { self.setState({ hl: null, demoMsg: 'Done! Each tower is one brick taller, like stairs.' }); }, at));
    at += 2200;
    T.push(setTimeout(function () { self.setState({ order: [5, 2, 4, 6, 1, 3], demo: false, demoMsg: '' }); }, at));
    this.demoT = T;
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var tablet = this.props.device === 'tablet';
    var Z = tablet ? 1.4 : 1;
    var done = this.sorted(s.order, s.dir);
    var target = s.order.slice().sort(function (a, b) { return s.dir === 'up' ? a - b : b - a; });
    return {
      W: tablet ? 834 : 390, H: tablet ? 1194 : 844, Z: Z, IW: tablet ? 596 : 390, IH: tablet ? 853 : 844,
      hubHref: tablet ? 'HubTablet.dc.html' : 'Hub.dc.html',
      isUp: s.dir === 'up', isDown: s.dir === 'down',
      upStyle: s.dir === 'up' ? 'background: #ffc21a; color: #5a3500;' : 'background: transparent; color: #c9c2ff;',
      downStyle: s.dir === 'down' ? 'background: #ffc21a; color: #5a3500;' : 'background: transparent; color: #c9c2ff;',
      modeUp: function () { self.setState({ dir: 'up' }); },
      modeDown: function () { self.setState({ dir: 'down' }); },
      shuffle: function () { self.setState({ order: [3, 6, 1, 5, 2, 4], picked: null }); },
      demo: s.demo,
      showOpacity: s.demo ? 0.5 : 1,
      showMe: function () { if (!self.state.demo) self.showMe(); },
      goalBars: target.map(function (n) { return { h: 4 + n * 5, color: self.pal()[n][0] }; }),
      goalText: s.dir === 'up' ? 'Line up 1 to 6, smallest first, so the towers make stairs going up.' : 'Line up 6 to 1, biggest first, so the stairs go down.',
      prompt: s.demo ? s.demoMsg : s.order.join('') === '' ? '' : done ? 'Perfect! ' + s.order.join(', ') + '. Like stairs!' : s.picked !== null ? 'Now tap where it should go.' : 'Drag a tower onto another tower to swap them. Or tap two towers.',
      promptColor: done ? '#ffe266' : '#ffffff',
      marks: s.order.map(function (n, i) { return { fill: n === target[i] ? '#5fe06e' : '#4b3eaa' }; }),
      towers: s.order.map(function (n, i) {
        var isDrag = s.drag && s.drag.moved && s.drag.i === i;
        var flash = s.swapFlash && s.swapFlash.indexOf(i) >= 0;
        var wrap = isDrag
          ? 'z-index: 20; transition: none; transform: translate(' + (s.drag.dx / Z) + 'px, ' + (s.drag.dy / Z) + 'px) scale(1.06); cursor: grabbing;'
          : 'transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); transform: ' + (s.picked === i ? 'translateY(-10px)' : flash ? 'scale(1.08)' : 'none') + ';' + (done ? ' filter: drop-shadow(0 0 8px rgba(255,226,102,0.7));' : '');
        var studs = [];
        for (var k = 0; k < n - 1; k++) studs.push({ style: self.face(n, true) });
        var lit = s.hl && s.hl.indexOf(i) >= 0;
        return {
          hand: !!(s.hl && s.hl[0] === i),
          ring: lit ? 'outline: 4px solid #ffe266; outline-offset: 2px;' : '',
          n: n, slot: String(i), label: 'Tower of ' + n, wrap: wrap,
          face: self.face(n, false), studs: studs,
          down: function (e) {
            if (self.state.demo) return;
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
            self.setState({ drag: { i: i, id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false } });
          },
          move: function (e) {
            var d = self.state.drag;
            if (!d || d.id !== e.pointerId) return;
            var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
            self.setState({ drag: Object.assign({}, d, { dx: dx, dy: dy, moved: d.moved || Math.abs(dx) + Math.abs(dy) > 8 }) });
          },
          up: function (e) {
            var d = self.state.drag;
            if (!d || d.id !== e.pointerId) return;
            if (!d.moved) { self.setState({ drag: null }); return; }
            self.justDragged = true;
            var el = e.currentTarget;
            el.style.visibility = 'hidden';
            var hit = document.elementFromPoint(e.clientX, e.clientY);
            el.style.visibility = '';
            var slot = hit && hit.closest ? hit.closest('[data-slot]') : null;
            if (slot) self.swap(i, Number(slot.getAttribute('data-slot')));
            else self.setState({ drag: null });
          },
          cancel: function () { self.setState({ drag: null }); },
          tap: function () {
            if (self.justDragged) { self.justDragged = false; return; }
            if (s.demo) return;
            if (s.picked === null) self.setState({ picked: i });
            else if (s.picked === i) self.setState({ picked: null });
            else self.swap(s.picked, i);
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
