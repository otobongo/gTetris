<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape Sorter, eight pieces</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<dc-import name="Sorter" device="{{device}}" level="7" moment="play" hint-size="390px,844px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","phoneShort"],"default":"phone"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { device: this.props.device ?? 'phone' }; }
}
</script>
</body>
</html>
