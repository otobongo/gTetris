<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape Sorter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button:focus-visible, a:focus-visible { outline: 3px solid #ffc21a; outline-offset: 2px; } @keyframes bw-fade { from { opacity: 0; } } @keyframes bw-card-in { from { opacity: 0; transform: scale(0.96); } } .bw-appear { animation: bw-fade 150ms linear; } .bw-card { animation: bw-card-in 200ms cubic-bezier(0.16,1,0.3,1); } .bw-dot { transition: width 200ms cubic-bezier(0.16,1,0.3,1); } .bw-dot-fill { transition: transform 350ms cubic-bezier(0.16,1,0.3,1); } @media (prefers-reduced-motion: reduce) { .bw-card { animation: bw-fade 150ms linear; } .bw-dot { transition: none; } .bw-dot-fill { transition: opacity 150ms linear; } .sort-piece[data-drag="false"] { transform: none !important; transition: opacity 150ms linear !important; } .sort-hole { transform: none !important; } }</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; overflow: hidden; background: radial-gradient(120% 80% at 50% 15%, #33278a, #1a1246); font-family: 'Baloo 2', system-ui, sans-serif; color: #ffffff;">
<div style="zoom: {{z}}; width: {{iw}}px; height: {{ih}}px; box-sizing: border-box; padding: 20px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative;">

<div style="width: 100%; display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 10px;">
<a href="{{hubHref}}" aria-label="Back to home" style="width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="text-align: center; line-height: 1.1; min-width: 0;">
<div style="font-size: 24px; font-weight: 800;">{{title}}</div>
<sc-if value="{{showDots}}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="{{dotsLabel}}" style="display: flex; justify-content: center; gap: 6px; margin-top: 4px;">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<span class="bw-dot" style="display: block; width: {{d.w}}px; height: 10px; border-radius: 999px; overflow: hidden; background: {{d.bg}}; box-shadow: {{d.ring}};"><span class="bw-dot-fill" style="display: block; width: 100%; height: 100%; background: #ffc21a; transform-origin: left center; transform: scaleX({{d.fill}}); opacity: {{d.fill}};"></span></span>
</sc-for>
</div>
</sc-if>
</div>
<div style="display: grid;">
<sc-if value="{{showPlayArea}}" hint-placeholder-val="{{ true }}">
<button onClick="{{speak}}" aria-label="{{speakLabel}}" style="border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9.5a3.5 3.5 0 0 1 0 5"></path><path d="M19 7a7 7 0 0 1 0 10"></path></svg>
</button>
</sc-if>
</div>
</div>

<sc-if value="{{showPlayArea}}" hint-placeholder-val="{{ true }}">
<div style="width: 100%; min-height: 54px; display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; align-items: center; gap: 10px;">
<p role="status" style="grid-column: 2; grid-row: 1; margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3; color: {{helpcolor}}; text-align: center; text-wrap: balance;">{{help}}</p>
<div style="grid-column: 1; grid-row: 1; display: grid;">
<sc-if value="{{showOffer}}" hint-placeholder-val="{{ false }}">
<button class="bw-appear" onClick="{{swap}}" aria-label="New puzzle" style="border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #063510; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h12M13 5l3 3-3 3"></path><path d="M20 16H8M11 13l-3 3 3 3"></path></svg>
</button>
</sc-if>
</div>
</div>
</sc-if>

<div role="group" aria-label="Holes" style="width: 100%; box-sizing: border-box; padding: 18px; border-radius: 30px; background: linear-gradient(180deg, #4a3ca8, #30257a); box-shadow: inset 0 0 0 4px #5444b8, 0 8px 0 #241a63;">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; justify-items: center; {{holesbox}}">
<sc-for list="{{holes}}" as="h" hint-placeholder-count="5">
<sc-if value="{{h.open}}" hint-placeholder-val="{{ true }}">
<button class="sort-hole" onClick="{{h.tap}}" data-hole="{{h.key}}" aria-label="{{h.label}}" style="border: 0; padding: 0; cursor: pointer; width: 92px; height: 92px; border-radius: 22px; display: grid; place-items: center; transition: box-shadow 200ms cubic-bezier(0.16,1,0.3,1), background 200ms cubic-bezier(0.16,1,0.3,1); {{h.wrap}}">
<span style="width: 70px; height: 70px; {{h.style}}"></span>
</button>
</sc-if>
<sc-if value="{{h.filled}}" hint-placeholder-val="{{ false }}">
<div role="img" aria-label="{{h.label}}" style="width: 92px; height: 92px; border-radius: 22px; display: grid; place-items: center; {{h.wrap}}">
<span style="width: 70px; height: 70px; {{h.style}}"></span>
</div>
</sc-if>
</sc-for>
</div>
</div>

<sc-if value="{{showPlayArea}}" hint-placeholder-val="{{ true }}">
<div style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 16px; border-radius: 18px; background: #30257a;">
<sc-if value="{{showBadge}}" hint-placeholder-val="{{ true }}">
<span role="img" aria-label="{{badgeName}}" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; background: #ffc21a; color: #5a3500; font-size: 22px; font-weight: 800;">{{badge}}</span>
</sc-if>
<sc-if value="{{showQuestionBadge}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; background: #ffc21a; color: #5a3500; font-size: 22px; font-weight: 800;">?</span>
</sc-if>
<span style="min-width: 0; font-size: 16px; font-weight: 700; line-height: 1.2;">{{fact}}</span>
</div>
</sc-if>

<div style="flex-grow: 1;"></div>

<div style="width: 100%; box-sizing: border-box; padding: 18px 10px; border-radius: 28px; background: #1d1550; box-shadow: inset 0 4px 10px rgba(0,0,0,0.45); display: flex; justify-content: center;">
<div role="group" aria-label="Shapes to place" style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; {{traybox}}">
<sc-if value="{{showTray}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{tray}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.live}}" hint-placeholder-val="{{ true }}">
<button class="sort-piece" data-drag="{{t.dragging}}" onClick="{{t.tap}}" onPointerDown="{{t.down}}" onPointerMove="{{t.move}}" onPointerUp="{{t.up}}" onPointerCancel="{{t.cancel}}" aria-label="{{t.label}}" aria-pressed="{{t.on}}" style="position: relative; border: 0; padding: 0; cursor: grab; touch-action: none; width: 64px; height: 76px; display: grid; place-items: center; background: transparent; {{t.wrap}}">
<span style="width: 58px; height: 58px; {{t.style}}"></span>
</button>
</sc-if>
<sc-if value="{{t.ghost}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="width: 64px; height: 76px; display: grid; place-items: center; opacity: 0.2; transform: scale(0.85);">
<span style="width: 58px; height: 58px; {{t.style}}"></span>
</span>
</sc-if>
</sc-for>
</sc-if>
<sc-if value="{{showNext}}" hint-placeholder-val="{{ false }}">
<button class="bw-appear" onClick="{{next}}" style="border: 0; cursor: pointer; font-family: inherit; min-width: 220px; height: 58px; padding: 0 20px; box-sizing: border-box; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; color: #063510; font-size: 20px; font-weight: 800; line-height: 1.15; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26;">Next puzzle<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"></path></svg></button>
</sc-if>
</div>
</div>

<sc-if value="{{cardOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(10,6,30,0.65); display: grid; place-items: center; padding: 16px;">
<div class="bw-card" role="dialog" aria-modal="true" aria-labelledby="sort-card-title" aria-describedby="sort-card-fact" style="width: 100%; max-width: 330px; box-sizing: border-box; text-align: center; padding: 24px 20px 20px; border-radius: 26px; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 8px 0 #241a63; color: #ffffff;">
<h2 id="sort-card-title" style="margin: 0; font-size: 32px; font-weight: 800; line-height: 1.1; text-wrap: balance;">{{cardTitle}}</h2>
<div role="img" aria-label="{{starsLabel}}" style="display: flex; justify-content: center; align-items: center; gap: {{starsgap}}px; margin: 10px 0;">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="3">
<svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z" fill="{{s.fill}}"></path></svg>
</sc-for>
<sc-if value="{{showTotal}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="font-size: 24px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">{{totalText}}</span>
</sc-if>
</div>
<p id="sort-card-fact" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; text-wrap: balance;">{{cardFact}}</p>
<sc-if value="{{showRule}}" hint-placeholder-val="{{ true }}">
<p style="margin: 6px 0 0; font-size: 14px; font-weight: 700; line-height: 1.35; text-wrap: balance;">3 stars: 1 slip or none. 2 stars: 4 slips or fewer.</p>
</sc-if>
<sc-if value="{{showNote}}" hint-placeholder-val="{{ false }}">
<p style="margin: 6px 0 0; font-size: 14px; font-weight: 700; line-height: 1.35; text-wrap: balance;">A grown-up can pick a level to play again.</p>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px;">
<sc-if value="{{showPlayNext}}" hint-placeholder-val="{{ true }}">
<button onClick="{{playNext}}" style="border: 0; cursor: pointer; font-family: inherit; width: 100%; min-height: 56px; padding: 14px 20px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #063510; font-size: 20px; font-weight: 800; line-height: 1.15; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26;">{{playLabel}}</button>
<a href="{{hubHref}}" style="width: 100%; min-height: 48px; padding: 10px 18px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #ffffff; font-size: 17px; font-weight: 800; line-height: 1.15; background: linear-gradient(180deg, #6b5bd0, #4b3eaa); box-shadow: 0 5px 0 #241a63;">Back to games</a>
</sc-if>
<sc-if value="{{showFinal}}" hint-placeholder-val="{{ false }}">
<a href="{{hubHref}}" style="width: 100%; min-height: 56px; padding: 14px 20px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #063510; font-size: 20px; font-weight: 800; line-height: 1.15; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 5px 0 #0f7a26;">Back to games</a>
</sc-if>
</div>
</div>
</div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"level":{"editor":"enum","options":["1","3","5","7","9"],"default":"3"},"puzzle":{"editor":"enum","options":["1","2","3","4"],"default":"3"},"moment":{"editor":"enum","options":["play","picked","wrong","solved","stuck","levelDone","gameDone"],"default":"play"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fromLever();
    this.justDragged = false;
  }
  // The board's five shapes plus rectangle, diamond and pentagon (brief 4.2 and 7.4). Badge: the count it shows and its name.
  shapes() {
    return {
      circle: { clip: 'border-radius: 50%;', badge: '0', badgeName: 'no corners', fact: 'A circle is round. It has no corners.' },
      square: { clip: 'border-radius: 6px;', badge: '4', badgeName: '4 sides', fact: 'A square has 4 sides, all the same length.' },
      triangle: { clip: 'clip-path: polygon(50% 4%, 98% 94%, 2% 94%);', badge: '3', badgeName: '3 sides', fact: 'A triangle has 3 sides and 3 corners.' },
      star: { clip: 'clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);', badge: '5', badgeName: '5 points', fact: 'A star has 5 points.' },
      hexagon: { clip: 'clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%);', badge: '6', badgeName: '6 sides', fact: 'A hexagon has 6 sides, like a honeycomb cell.' },
      rectangle: { clip: 'clip-path: inset(22% 0 round 6px);', badge: '4', badgeName: '4 sides', fact: 'A rectangle has 4 sides. Two are long, two are short.' },
      diamond: { clip: 'clip-path: polygon(50% 0, 90% 50%, 50% 100%, 10% 50%);', badge: '4', badgeName: '4 sides', fact: 'A diamond has 4 sides of the same length.' },
      pentagon: { clip: 'clip-path: polygon(50% 2%, 98% 38%, 80% 96%, 20% 96%, 2% 38%);', badge: '5', badgeName: '5 sides', fact: 'A pentagon has 5 sides and 5 corners.' }
    };
  }
  // The --brick-* base colours.
  colors() {
    return { yellow: '#ffc21a', red: '#f03a3a', blue: '#2f8cff', green: '#1fb53c', pink: '#ff5fb4', purple: '#9b4dff' };
  }
  // All 9 levels, 6 puzzles each (brief 4.2). Puzzle 1 of Levels 1 to 5 is the old board's set (Level 5's green pieces are yellow, 9.4).
  // Levels 1 to 8 take at most one shape per family; colour sets avoid red with green, blue with purple and red with pink.
  levels() {
    var y = function (shapes) { return shapes.map(function (sh) { return [sh, 'yellow']; }); };
    var x2 = function (shapes, c1, c2) { return shapes.map(function (sh) { return [sh, c1]; }).concat(shapes.map(function (sh) { return [sh, c2]; })); };
    var x3 = function (shapes, cols, skip) { var out = []; cols.forEach(function (c) { shapes.forEach(function (sh) { out.push([sh, c]); }); }); if (skip !== undefined) out.splice(skip, 1); return out; };
    return {
      1: { colorMatters: false, puzzles: [y(['circle', 'square']), y(['triangle', 'star']), y(['hexagon', 'circle']), y(['star', 'rectangle']), y(['diamond', 'triangle']), y(['pentagon', 'circle'])] },
      2: { colorMatters: false, puzzles: [y(['circle', 'square', 'triangle']), y(['star', 'hexagon', 'rectangle']), y(['triangle', 'pentagon', 'circle']), y(['diamond', 'star', 'circle']), y(['hexagon', 'triangle', 'square']), y(['star', 'circle', 'pentagon'])] },
      3: { colorMatters: false, puzzles: [
        y(['circle', 'square', 'triangle', 'star', 'hexagon']), y(['star', 'rectangle', 'circle', 'pentagon', 'triangle']), y(['triangle', 'diamond', 'hexagon', 'circle', 'star']),
        y(['pentagon', 'circle', 'star', 'square', 'triangle']), y(['rectangle', 'triangle', 'hexagon', 'star', 'circle']), y(['circle', 'diamond', 'star', 'triangle', 'pentagon'])] },
      4: { colorMatters: true, puzzles: [
        x2(['circle', 'square'], 'red', 'blue'), x2(['triangle', 'star'], 'yellow', 'blue'), x2(['hexagon', 'circle'], 'red', 'yellow'),
        x2(['square', 'triangle'], 'green', 'yellow'), x2(['star', 'pentagon'], 'pink', 'blue'), x2(['rectangle', 'circle'], 'purple', 'yellow')] },
      5: { colorMatters: true, puzzles: [
        [['circle', 'red'], ['circle', 'blue'], ['triangle', 'yellow'], ['triangle', 'red'], ['star', 'blue'], ['star', 'yellow']],
        [['square', 'blue'], ['square', 'yellow'], ['hexagon', 'red'], ['hexagon', 'blue'], ['triangle', 'yellow'], ['triangle', 'red']],
        [['star', 'red'], ['star', 'yellow'], ['circle', 'blue'], ['circle', 'yellow'], ['pentagon', 'red'], ['pentagon', 'blue']],
        [['rectangle', 'green'], ['rectangle', 'yellow'], ['circle', 'blue'], ['circle', 'green'], ['star', 'yellow'], ['star', 'blue']],
        [['triangle', 'pink'], ['triangle', 'blue'], ['diamond', 'yellow'], ['diamond', 'pink'], ['hexagon', 'blue'], ['hexagon', 'yellow']],
        [['circle', 'purple'], ['circle', 'yellow'], ['square', 'green'], ['square', 'purple'], ['star', 'yellow'], ['star', 'green']]] },
      6: { colorMatters: true, puzzles: [
        x3(['circle', 'triangle'], ['red', 'blue', 'yellow']), x3(['square', 'star'], ['green', 'blue', 'yellow']), x3(['hexagon', 'circle'], ['pink', 'yellow', 'blue']),
        x3(['triangle', 'rectangle'], ['purple', 'yellow', 'green']), x3(['star', 'pentagon'], ['red', 'yellow', 'blue']), x3(['diamond', 'circle'], ['pink', 'green', 'yellow'])] },
      7: { colorMatters: true, puzzles: [
        x2(['circle', 'square', 'triangle', 'star'], 'blue', 'yellow'), x2(['hexagon', 'rectangle', 'circle', 'star'], 'red', 'yellow'),
        x2(['triangle', 'diamond', 'pentagon', 'circle'], 'green', 'blue'), x2(['star', 'square', 'hexagon', 'triangle'], 'pink', 'yellow'),
        x2(['circle', 'rectangle', 'pentagon', 'star'], 'purple', 'yellow'), x2(['triangle', 'diamond', 'hexagon', 'circle'], 'red', 'blue')] },
      8: { colorMatters: true, puzzles: [
        x3(['circle', 'square', 'triangle'], ['red', 'blue', 'yellow'], 8), x3(['star', 'hexagon', 'circle'], ['green', 'blue', 'yellow'], 1),
        x3(['triangle', 'rectangle', 'pentagon'], ['pink', 'yellow', 'blue'], 3), x3(['circle', 'diamond', 'star'], ['purple', 'yellow', 'green'], 5),
        x3(['square', 'triangle', 'hexagon'], ['red', 'yellow', 'blue'], 7), x3(['pentagon', 'circle', 'star'], ['pink', 'green', 'yellow'], 0)] },
      9: { colorMatters: true, puzzles: [
        x2(['square', 'rectangle', 'pentagon', 'hexagon'], 'red', 'blue'), x2(['square', 'diamond', 'pentagon', 'hexagon'], 'yellow', 'green'),
        x2(['rectangle', 'diamond', 'pentagon', 'hexagon'], 'blue', 'yellow'), x2(['square', 'rectangle', 'pentagon', 'hexagon'], 'pink', 'yellow'),
        x2(['square', 'diamond', 'pentagon', 'hexagon'], 'purple', 'yellow'), x2(['rectangle', 'diamond', 'pentagon', 'hexagon'], 'red', 'yellow')] }
    };
  }
  // Sample child for the stuck limits: Maya, ages 7 to 8 (brief 3.3: 4 slips, then 50 s with no right placement).
  limits() { return { count: 4, secs: 50 }; }
  levelOf(p) { return ['1', '3', '5', '7', '9'].indexOf(p.level) >= 0 ? parseInt(p.level, 10) : 3; }
  // One puzzle: pieces, the hole order and the tray order. The tray is the hole order turned by half,
  // so no piece starts over its own hole.
  board(level, idx) {
    var raw = this.levels()[level].puzzles[idx];
    var pieces = raw.map(function (p) { return { id: p[1] + '-' + p[0], shape: p[0], color: p[1] }; });
    var N = pieces.length;
    var step = { 2: 1, 3: 2, 4: 3, 5: 2, 6: 5, 8: 3 }[N] || 1;
    var holes = [];
    for (var j = 0; j < N; j++) holes.push(pieces[(j * step + idx) % N]);
    var k = Math.ceil(N / 2);
    var tray = holes.map(function (h, j) { return holes[(j + k) % N]; });
    return { pieces: pieces, holes: holes, tray: tray, colorMatters: this.levels()[level].colorMatters };
  }
  leverKey() {
    var p = this.props || {};
    return [p.level, p.puzzle, p.moment].join('|');
  }
  freshPuzzle() { return { picked: null, placed: {}, wrongHole: null, shake: 0, last: null, drag: null, wrongLine: null, seen: {}, wrongTaps: 0, idle: 0, offer: false, note: '' }; }
  name(pc, colorMatters) { return colorMatters ? pc.color + ' ' + pc.shape : pc.shape; }
  // The wrong line names what matched (brief 8.3).
  wrongLineFor(pc, hole, colorMatters) {
    if (!colorMatters) return 'That hole is for the ' + hole.shape + '.';
    if (pc.shape === hole.shape) return 'Same shape, but this hole is ' + hole.color + '.';
    if (pc.color === hole.color) return 'Same color, but this hole is a ' + hole.shape + '.';
    return 'That hole is for the ' + hole.color + ' ' + hole.shape + '.';
  }
  fromLever() {
    var p = this.props || {};
    var level = this.levelOf(p);
    var puzzle = Math.min(4, Math.max(1, parseInt(p.puzzle, 10) || 3));
    var moment = ['play', 'picked', 'wrong', 'solved', 'stuck', 'levelDone', 'gameDone'].indexOf(p.moment) >= 0 ? p.moment : 'play';
    if (moment === 'solved' && puzzle === 4) moment = 'levelDone';
    if (moment === 'levelDone' || moment === 'gameDone') puzzle = 4;
    var order = [0, 1, 2, 3, 4, 5];
    var B = this.board(level, order[puzzle - 1]);
    var s = Object.assign(this.freshPuzzle(), { lever: this.leverKey(), level: level, puzzle: puzzle, moment: 'play', order: order, slips: 1 });
    // One piece is already home, so its ghost and filled hole show; a two-piece board keeps both pieces out.
    var roomy = B.pieces.length > 2;
    var first = roomy ? B.tray[0] : null, second = roomy ? B.tray[1] : B.tray[0];
    if (roomy && (moment === 'picked' || moment === 'wrong' || moment === 'stuck')) { s.placed[first.id] = true; s.last = first.id; }
    if (moment === 'picked') s.picked = second.id;
    if (moment === 'wrong') {
      // On colour levels the sample tries the hole of a same-shape piece; otherwise the next open hole.
      var open = B.holes.filter(function (h) { return h.id !== second.id && !s.placed[h.id]; });
      var target = open.filter(function (h) { return h.shape === second.shape; })[0] || open[0];
      s.wrongHole = target.id;
      s.wrongLine = this.wrongLineFor(second, target, B.colorMatters);
      s.seen[second.id + '>' + target.id] = true;
      s.wrongTaps = 1;
    }
    if (moment === 'stuck') { s.wrongTaps = this.limits().count; s.slips = this.limits().count; s.offer = true; }
    if (moment === 'solved' || moment === 'levelDone' || moment === 'gameDone') {
      B.pieces.forEach(function (pc) { s.placed[pc.id] = true; });
      s.last = B.tray[B.tray.length - 1].id;
      s.moment = moment;
    }
    return s;
  }
  // The state to render: the last interaction, unless a lever changed since.
  st() {
    var key = this.leverKey();
    if (this.pending && this.pending.lever === key) return this.pending;
    if (this.state && this.state.lever === key) return this.state;
    this.pending = this.fromLever();
    return this.pending;
  }
  put(patch) {
    var next = Object.assign({}, this.st(), patch, { lever: this.leverKey() });
    this.pending = next;
    this.setState(next);
  }
  componentDidMount() {
    var self = this;
    // The time signal: seconds with no right placement, counted only while the puzzle is on screen (brief 3.3).
    this.timer = setInterval(function () {
      var s = self.st();
      if (s.moment !== 'play') return;
      var idle = s.idle + 1;
      self.put({ idle: idle, offer: s.offer || idle === self.limits().secs });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.cardT); clearTimeout(this.wrongT); (this.shakeT || []).forEach(clearTimeout); }
  say(text) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  curBoard() { var cs = this.st(); return this.board(cs.level, cs.order[cs.puzzle - 1]); }
  tryPlace(id, holeId) {
    var self = this;
    var cs = this.st();
    if (cs.moment !== 'play' || cs.placed[holeId]) { this.put({ drag: null }); return; }
    var B = this.curBoard();
    var pc = B.pieces.filter(function (x) { return x.id === id; })[0];
    var hole = B.pieces.filter(function (x) { return x.id === holeId; })[0];
    if (id === holeId) {
      // A right placement is progress: it hides the offer and resets the time signal. The game says the piece's name.
      var placed = Object.assign({}, cs.placed);
      placed[holeId] = true;
      var done = B.pieces.every(function (x) { return placed[x.id]; });
      var patch = { placed: placed, picked: null, last: id, drag: null, wrongLine: null, wrongHole: null, idle: 0, offer: false, note: '' };
      if (done) {
        patch.moment = cs.puzzle < 4 ? 'solved' : 'lastSolved';
        if (cs.puzzle === 4) { clearTimeout(this.cardT); this.cardT = setTimeout(function () { self.put({ moment: 'levelDone' }); }, 600); }
      }
      this.put(patch);
      this.say(this.name(pc, B.colorMatters));
      return;
    }
    // A wrong placement: the piece goes back, the pick clears, the hole shakes with a red ring.
    var key = id + '>' + holeId;
    var seen = Object.assign({}, cs.seen);
    var fresh = !seen[key];
    seen[key] = true;
    var wrongTaps = cs.wrongTaps + 1;
    this.put({
      wrongHole: holeId, drag: null, picked: null, note: '',
      wrongLine: this.wrongLineFor(pc, hole, B.colorMatters),
      seen: seen, slips: cs.slips + (fresh ? 1 : 0), wrongTaps: wrongTaps, offer: cs.offer || wrongTaps >= this.limits().count
    });
    (this.shakeT || []).forEach(clearTimeout);
    this.shakeT = [-9, 9, -6, 6, -3, 0].map(function (x, i) { return setTimeout(function () { self.put({ shake: x }); }, i * 60); });
    clearTimeout(this.wrongT);
    this.wrongT = setTimeout(function () { self.put({ wrongHole: null }); }, 660);
  }
  renderVals() {
    var self = this;
    var s = this.st();
    var tablet = this.props.device === 'tablet';
    var Z = tablet ? 1.4 : 1;
    var S = this.shapes(), K = this.colors();
    var B = this.board(s.level, s.order[s.puzzle - 1]);
    var cm = B.colorMatters;
    var m = s.moment;
    var finished = m === 'gameDone';
    var solvedNow = m === 'solved' || m === 'lastSolved' || m === 'levelDone' || finished;
    var playing = m === 'play';
    var byId = {};
    B.pieces.forEach(function (pc) { byId[pc.id] = pc; });
    var last = s.last ? byId[s.last] : null;
    var dragging = s.drag && s.drag.moved ? s.drag.id : null;
    var offerLine = 'This one is tricky. Want a different puzzle?';
    var help = solvedNow ? 'Every shape is home.'
      : s.offer ? offerLine
      : s.note ? s.note
      : s.wrongLine ? s.wrongLine
      : dragging ? 'Drop the ' + this.name(byId[dragging], cm) + ' in its hole.'
      : s.picked ? 'Now tap the ' + this.name(byId[s.picked], cm) + ' hole.'
      : cm ? 'Match the shape and the color.' : 'Drag each shape into its hole.';
    var fact = last ? S[last.shape].fact : cm ? 'Look closely: each hole has a color too.' : 'Every shape has a home. Look at the corners.';

    var perRow = tablet ? 8 : 4;
    var rows = Math.ceil(B.pieces.length / perRow);
    var rowLen = Math.min(perRow, B.pieces.length);
    var trayMinH = rows * 76 + (rows - 1) * 8;

    // Dots (four-puzzle brief section 8).
    var solvedCount = s.puzzle - 1 + (solvedNow ? 1 : 0);
    var dots = [1, 2, 3, 4].map(function (i) {
      var isCur = i === s.puzzle;
      var filled = i < s.puzzle || (isCur && solvedNow);
      return { w: isCur ? 32 : 22, bg: isCur ? '#7cc0ff' : '#1d1550', ring: isCur || filled ? 'none' : 'inset 0 0 0 2px #8e85d6', fill: filled ? 1 : 0 };
    });
    var starsWon = finished ? 3 : s.slips <= 1 ? 3 : s.slips <= 4 ? 2 : 1;
    var cardFact = s.slips === 0 ? '4 puzzles, no slips.' : s.slips === 1 ? '4 puzzles, 1 slip.' : '4 puzzles, ' + s.slips + ' slips.';
    var lastOfGame = s.level === 9;
    var pieceLook = function (pc) { return S[pc.shape].clip + ' background: ' + K[pc.color] + '; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2), inset 0 4px 0 rgba(255,255,255,0.3);'; };

    return {
      w: tablet ? 834 : 390, h: tablet ? 1194 : 844, z: Z, iw: tablet ? 596 : 390, ih: tablet ? 853 : 844,
      hubHref: tablet ? 'HubTablet.dc.html' : 'Hub.dc.html',
      title: finished ? 'Shape Sorter' : 'Level ' + s.level,
      showDots: !finished, dots: dots,
      dotsLabel: solvedCount === 4 ? '4 of 4 solved.' : 'Puzzle ' + s.puzzle + ' of 4. ' + solvedCount + ' solved.',
      showPlayArea: !finished,
      // Speech only after a tap: the help line, then the fact. While the offer shows, the offer line.
      speakLabel: s.offer && playing ? 'Read the help line aloud' : 'Hear the help line',
      speak: function () {
        var cs = self.st();
        if (cs.offer && cs.moment === 'play') { self.say(offerLine); return; }
        self.say(help + ' ' + fact);
      },
      help: help,
      helpcolor: s.wrongLine && !s.offer && !s.note && !solvedNow ? '#ff9fd4' : '#ffffff',
      showOffer: playing && s.offer,
      swap: function () {
        var cs = self.st();
        if (cs.moment !== 'play') return;
        // The current puzzle moves to the end of the queue; the dots stay where they are.
        var order = cs.order.slice(0, cs.puzzle - 1).concat(cs.order.slice(cs.puzzle), [cs.order[cs.puzzle - 1]]);
        self.put(Object.assign(self.freshPuzzle(), { order: order, note: 'Here is a different puzzle.' }));
      },
      // The finished state shows the empty holes panel and tray.
      holesbox: finished ? 'min-height: 198px;' : '',
      holes: finished ? [] : B.holes.map(function (pc) {
        var filled = !!s.placed[pc.id];
        var wrong = s.wrongHole === pc.id;
        var hex = K[pc.color];
        return {
          key: pc.id, open: !filled, filled: filled,
          label: filled ? 'Filled ' + self.name(pc, cm) + ' hole' : self.name(pc, cm) + ' hole',
          wrap: wrong
            ? 'transform: translateX(' + s.shake + 'px); background: rgba(255,77,94,0.35); box-shadow: 0 0 0 4px #ff4d5e;'
            : filled ? 'background: rgba(0,0,0,0.12); box-shadow: 0 0 0 3px rgba(255,255,255,0.6);' : 'background: rgba(0,0,0,0.12);',
          // A hole is drawn in its own colour, sunk in so it still reads as empty.
          style: filled ? pieceLook(pc) : S[pc.shape].clip + ' background: ' + hex + '; box-shadow: inset 0 10px 14px rgba(0,0,0,0.55), inset 0 -2px 0 rgba(255,255,255,0.25);',
          tap: function () { var cs = self.st(); if (!cs.picked || cs.placed[pc.id]) return; self.tryPlace(cs.picked, pc.id); }
        };
      }),
      showBadge: !!last, badge: last ? S[last.shape].badge : '', badgeName: last ? S[last.shape].badgeName : '',
      showQuestionBadge: !last,
      fact: fact,
      traybox: 'width: ' + (rowLen * 64 + (rowLen - 1) * 8) + 'px; min-height: ' + (finished ? 76 : trayMinH) + 'px;',
      showTray: !solvedNow,
      // A placed piece leaves a faint ghost in its slot, so nothing moves under a finger.
      tray: B.tray.map(function (pc, i) {
        var gone = !!s.placed[pc.id];
        var on = s.picked === pc.id;
        var isDrag = dragging === pc.id;
        var wrap;
        if (isDrag) wrap = 'z-index: 20; transition: none; transform: translate(' + (s.drag.dx / Z) + 'px, ' + (s.drag.dy / Z) + 'px) scale(1.18); cursor: grabbing;';
        else wrap = 'transition: transform 200ms cubic-bezier(0.16,1,0.3,1); transform: ' + (on ? 'translateY(-12px) scale(1.12)' : 'rotate(' + (i % 2 ? 8 : -8) + 'deg)') + ';';
        return {
          live: !gone, ghost: gone,
          label: self.name(pc, cm), on: on ? 'true' : 'false', dragging: isDrag ? 'true' : 'false', wrap: wrap,
          style: pieceLook(pc) + (on || isDrag ? ' filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));' : ''),
          down: function (e) {

          },
          move: function (e) {
            var d = self.st().drag;
            if (!d || d.pid !== e.pointerId) return;
            var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
            var moved = d.moved || Math.abs(dx) + Math.abs(dy) > 8;
            self.put(Object.assign({ drag: Object.assign({}, d, { dx: dx, dy: dy, moved: moved }) }, moved && !d.moved ? { wrongLine: null, picked: null } : {}));
          },
          up: function (e) {
            var d = self.st().drag;
            if (!d || d.pid !== e.pointerId) return;
            if (!d.moved) { self.put({ drag: null }); return; }

            var el = e.currentTarget;
            el.style.visibility = 'hidden';
            var hit = document.elementFromPoint(e.clientX, e.clientY);

            var holeEl = hit && hit.closest ? hit.closest('[data-hole]') : null;
            var h = holeEl ? holeEl.getAttribute('data-hole') : null;

            if (h && !self.st().placed[h]) self.tryPlace(pc.id, h);

          },
          // A drag cut off by the system puts the piece back with no slip.
          cancel: function () { self.put({ drag: null }); },
          tap: function () {

          }

      }),
      showNext: m === 'solved',
      next: function () {
        var cs = self.st();
        if (cs.moment !== 'solved') return;
        self.put(Object.assign(self.freshPuzzle(), { puzzle: cs.puzzle + 1, moment: 'play' }));
      },
      cardOpen: m === 'levelDone' || finished,
      cardTitle: finished || lastOfGame ? 'You finished every level!' : 'You finished Level ' + s.level,
      stars: finished ? [{ fill: '#ffb21f' }] : [0, 1, 2].map(function (i) { return { fill: i < starsWon ? '#ffb21f' : 'rgba(0,0,0,0.3)' }; }),
      starsLabel: finished ? '25 of 27 stars' : starsWon + ' of 3 stars',
      starsgap: finished ? 6 : 4,
      showTotal: finished,
      totalText: '25 of 27',
      // The every-level totals are sample data.
      cardFact: finished || lastOfGame ? '9 levels, 25 of 27 stars.' : cardFact,
      showRule: !finished && !lastOfGame,
      showNote: finished,
      showPlayNext: !finished && !lastOfGame,
      showFinal: finished || lastOfGame,
      playLabel: 'Play Level ' + (s.level + 1),
      playNext: function () {
        var cs = self.st();
        if (cs.moment !== 'levelDone' || cs.level >= 9) return;

  }
}
