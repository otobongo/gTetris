<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape Sorter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{W}}px; height: {{H}}px; overflow: hidden; background: radial-gradient(120% 80% at 50% 15%, #33278a, #1a1246); font-family: 'Baloo 2', system-ui, sans-serif; color: #ffffff;">
<div style="zoom: {{Z}}; width: {{IW}}px; height: {{IH}}px; box-sizing: border-box; padding: 20px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;">

<div style="width: 100%; display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 10px;">
<a href="{{hubHref}}" aria-label="Back to home" style="width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="text-align: center; line-height: 1.1;">
<div style="font-size: 24px; font-weight: 800;">Shape Sorter</div>
<div style="font-size: 15px; font-weight: 700; color: #c9c2ff;">Level {{levelNo}} of 5 · {{levelName}}</div>
</div>
<button onClick="{{reset}}" aria-label="Start over" style="border: 0; cursor: pointer; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, #5444b8, #3a2d8f); box-shadow: 0 5px 0 #241a63;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v5h5"></path></svg>
</button>
</div>

<p style="margin: 0; font-size: 18px; font-weight: 800; text-align: center; transition: color 0.2s; color: {{promptColor}};">{{prompt}}</p>

<div style="width: 100%; box-sizing: border-box; padding: 18px; border-radius: 30px; background: linear-gradient(180deg, #ff9a3d, #ff7a1a); box-shadow: inset 0 3px 0 rgba(255,255,255,0.35), 0 8px 0 #c4500a;">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; justify-items: center;">
<sc-for list="{{holes}}" as="h" hint-placeholder-count="5">
<button onClick="{{h.tap}}" data-hole="{{h.key}}" aria-label="{{h.label}}" style="border: 0; padding: 0; cursor: pointer; width: 92px; height: 92px; border-radius: 22px; display: grid; place-items: center; transition: transform 0.07s, box-shadow 0.2s, background 0.2s; {{h.wrap}}">
<span style="width: 70px; height: 70px; transition: background 0.25s; {{h.style}}"></span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 16px; border-radius: 18px; background: #30257a;">
<span style="width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #ffc21a; color: #5a3500; font-size: 22px; font-weight: 800;">{{sides}}</span>
<span style="font-size: 16px; font-weight: 700; line-height: 1.2;">{{fact}}</span>
</div>

<div style="flex-grow: 1;"></div>

<div style="width: 100%; box-sizing: border-box; padding: 18px 10px; border-radius: 28px; background: #1d1550; box-shadow: inset 0 4px 10px rgba(0,0,0,0.45); display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: 112px;">
<sc-for list="{{tray}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.tap}}" onPointerDown="{{t.down}}" onPointerMove="{{t.move}}" onPointerUp="{{t.up}}" onPointerCancel="{{t.cancel}}" aria-label="{{t.label}}" aria-pressed="{{t.on}}" style="position: relative; border: 0; padding: 0; cursor: grab; touch-action: none; width: 64px; height: 76px; display: grid; place-items: center; background: transparent; {{t.wrap}}">
<span style="width: 58px; height: 58px; {{t.style}}"></span>
</button>
</sc-for>
<sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<span style="font-size: 24px; font-weight: 800;">All sorted!</span>
<button onClick="{{nextLevel}}" style="border: 0; cursor: pointer; font-family: inherit; color: #ffffff; font-size: 17px; font-weight: 800; padding: 8px 22px; border-radius: 14px; background: linear-gradient(180deg, #5fe06e, #1fb53c); box-shadow: 0 4px 0 #0f7a26;">{{nextLabel}}</button>
</div>
</sc-if>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 0, picked: null, placed: {}, wrongHole: null, shake: 0, last: null, drag: null, bounce: null, oops: null };
    this.justDragged = false;
  }
  shapes() {
    return {
      circle: { clip: 'border-radius: 50%;', sides: 0, fact: 'A circle is round. It has no corners at all!' },
      square: { clip: 'border-radius: 6px;', sides: 4, fact: 'A square has 4 sides, all the same length.' },
      triangle: { clip: 'clip-path: polygon(50% 4%, 98% 94%, 2% 94%);', sides: 3, fact: 'A triangle has 3 sides and 3 corners.' },
      star: { clip: 'clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);', sides: 5, fact: 'A star has 5 points. Count them!' },
      hexagon: { clip: 'clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%);', sides: 6, fact: 'A hexagon has 6 sides, like a honeycomb cell.' }
    };
  }
  colors() {
    return {
      yellow: { hex: '#ffc21a', hole: '#7a5200' }, red: { hex: '#f03a3a', hole: '#7d1a1f' }, blue: { hex: '#2f8cff', hole: '#123f80' },
      green: { hex: '#1fb53c', hole: '#0c5a1d' }, pink: { hex: '#ff5fb4', hole: '#7d2457' }, purple: { hex: '#9b4dff', hole: '#47207a' }
    };
  }
  /** Shape first with one color, then more shapes, then shape AND color together. */
  levels() {
    var p = function (shape, color) { return { id: color + '-' + shape, shape: shape, color: color }; };
    return [
      { name: 'Two shapes', colorMatters: false, pieces: [p('circle', 'yellow'), p('square', 'yellow')] },
      { name: 'Three shapes', colorMatters: false, pieces: [p('circle', 'yellow'), p('square', 'yellow'), p('triangle', 'yellow')] },
      { name: 'Five shapes', colorMatters: false, pieces: [p('circle', 'yellow'), p('square', 'yellow'), p('triangle', 'yellow'), p('star', 'yellow'), p('hexagon', 'yellow')] },
      { name: 'Shape and color', colorMatters: true, pieces: [p('circle', 'red'), p('circle', 'blue'), p('square', 'red'), p('square', 'blue')] },
      { name: 'Mix it up', colorMatters: true, pieces: [p('circle', 'red'), p('circle', 'blue'), p('triangle', 'green'), p('triangle', 'red'), p('star', 'blue'), p('star', 'green')] }
    ];
  }
  say(text) {
    try { var u = new SpeechSynthesisUtterance(text); u.rate = 0.85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
  }
  piece(id) { return this.levels()[this.state.level].pieces.filter(function (x) { return x.id === id; })[0]; }
  name(pc) { return this.levels()[this.state.level].colorMatters ? pc.color + ' ' + pc.shape : pc.shape; }
  tryPlace(id, holeId) {
    var self = this;
    var a = this.piece(id), h = this.piece(holeId);
    var L = this.levels()[this.state.level];
    if (id === holeId) {
      var placed = Object.assign({}, this.state.placed);
      placed[holeId] = true;
      this.setState({ placed: placed, picked: null, last: id, drag: null, oops: null });
      this.say(this.name(a));
      return;
    }
    var msg;
    if (L.colorMatters && a.shape === h.shape) msg = 'Right shape! But this hole is ' + h.color + '. Find the ' + a.color + ' ' + a.shape + ' hole.';
    else if (L.colorMatters && a.color === h.color) msg = 'Right color! But this hole is a ' + h.shape + '.';
    else msg = 'Oops! That hole is for a ' + this.name(h) + '.';
    this.setState({ wrongHole: holeId, drag: null, picked: null, bounce: id, oops: msg });
    [-9, 9, -6, 6, -3, 0].forEach(function (x, i) { setTimeout(function () { self.setState({ shake: x }); }, i * 70); });
    setTimeout(function () { self.setState({ wrongHole: null, bounce: null }); }, 650);
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var tablet = this.props.device === 'tablet';
    var Z = tablet ? 1.4 : 1;
    var S = this.shapes(), K = this.colors();
    var L = this.levels()[s.level];
    var holeOrder = L.pieces.slice().sort(function (a, b) { return (a.shape + a.color).length % 3 - (b.shape + b.color).length % 3 || (a.id < b.id ? 1 : -1); });
    var trayOrder = L.pieces.slice().reverse();
    var last = s.last ? this.piece(s.last) : null;
    var left = trayOrder.filter(function (pc) { return !s.placed[pc.id]; });
    var dragging = s.drag && s.drag.moved ? s.drag.id : null;
    var isLast = s.level === this.levels().length - 1;
    return {
      W: tablet ? 834 : 390, H: tablet ? 1194 : 844, Z: Z, IW: tablet ? 596 : 390, IH: tablet ? 853 : 844,
      hubHref: tablet ? 'HubTablet.dc.html' : 'Hub.dc.html',
      levelNo: s.level + 1, levelName: L.name,
      prompt: s.oops ? s.oops : dragging ? 'Drop the ' + this.name(this.piece(dragging)) + ' in its hole!' : left.length ? (L.colorMatters ? 'Match the shape AND the color.' : 'Drag each shape into its hole.') : 'You sorted every shape!',
      promptColor: s.oops ? '#ff9fd4' : '#ffffff',
      sides: last ? S[last.shape].sides : '?',
      fact: last ? S[last.shape].fact : (L.colorMatters ? 'Look closely: each hole has a color too.' : 'Every shape has a home. Look at the corners!'),
      allDone: left.length === 0,
      nextLabel: isLast ? 'Play again' : 'Next level',
      nextLevel: function () { self.setState({ level: isLast ? 0 : s.level + 1, picked: null, placed: {}, wrongHole: null, last: null, drag: null, bounce: null, oops: null }); },
      holes: holeOrder.map(function (pc) {
        var filled = !!s.placed[pc.id];
        var wrong = s.wrongHole === pc.id;
        var holeTint = L.colorMatters ? K[pc.color].hole : '#6e2d07';
        return {
          key: pc.id,
          label: (filled ? 'filled ' : '') + self.name(pc) + ' hole',
          wrap: wrong
            ? 'transform: translateX(' + s.shake + 'px); background: rgba(255,77,94,0.35); box-shadow: 0 0 0 4px #ff4d5e;'
            : filled ? 'background: rgba(0,0,0,0.12); box-shadow: 0 0 0 3px rgba(255,255,255,0.6);' : 'background: rgba(0,0,0,0.12);',
          style: S[pc.shape].clip + (filled ? ' background: ' + K[pc.color].hex + '; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2);' : ' background: ' + holeTint + ';'),
          tap: function () { if (!s.picked || filled) return; self.tryPlace(s.picked, pc.id); }
        };
      }),
      tray: left.map(function (pc, i) {
        var on = s.picked === pc.id;
        var isDrag = dragging === pc.id;
        var wrap;
        if (isDrag) wrap = 'z-index: 20; transition: none; transform: translate(' + (s.drag.dx / Z) + 'px, ' + (s.drag.dy / Z) + 'px) scale(1.18); cursor: grabbing;';
        else if (s.bounce === pc.id) wrap = 'z-index: 10; transition: transform 0.45s cubic-bezier(0.3, 1.8, 0.5, 1); transform: scale(1.15) rotate(-10deg);';
        else wrap = 'transition: transform 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); transform: ' + (on ? 'translateY(-12px) scale(1.12)' : 'rotate(' + (i % 2 ? 8 : -8) + 'deg)') + ';';
        return {
          label: self.name(pc), on: on, wrap: wrap,
          style: S[pc.shape].clip + ' background: ' + K[pc.color].hex + '; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2), inset 0 4px 0 rgba(255,255,255,0.3);' + (on || isDrag ? ' filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));' : ''),
          down: function (e) {
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
            self.setState({ drag: { id: pc.id, pid: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false }, oops: null });
          },
          move: function (e) {
            var d = self.state.drag;
            if (!d || d.pid !== e.pointerId) return;
            var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
            self.setState({ drag: Object.assign({}, d, { dx: dx, dy: dy, moved: d.moved || Math.abs(dx) + Math.abs(dy) > 8 }) });
          },
          up: function (e) {
            var d = self.state.drag;
            if (!d || d.pid !== e.pointerId) return;
            if (!d.moved) { self.setState({ drag: null }); return; }
            self.justDragged = true;
            var el = e.currentTarget;
            el.style.visibility = 'hidden';
            var hit = document.elementFromPoint(e.clientX, e.clientY);
            el.style.visibility = '';
            var hole = hit && hit.closest ? hit.closest('[data-hole]') : null;
            var h = hole ? hole.getAttribute('data-hole') : null;
            if (h && !s.placed[h]) self.tryPlace(pc.id, h);
            else { self.setState({ drag: null, bounce: pc.id }); setTimeout(function () { self.setState({ bounce: null }); }, 450); }
          },
          cancel: function () { self.setState({ drag: null }); },
          tap: function () {
            if (self.justDragged) { self.justDragged = false; return; }
            self.setState({ picked: on ? null : pc.id, oops: null });
          }
        };
      }),
      reset: function () { self.setState({ picked: null, placed: {}, wrongHole: null, last: null, drag: null, bounce: null, oops: null }); }
    };
  }
}
</script>
</body>
</html>
